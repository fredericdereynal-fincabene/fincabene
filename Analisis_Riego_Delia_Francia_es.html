const MM_OBJ = 4.0;
let wi = 0, view = 'week', di = 0, fi = 0;

const cls = (mm) => mm > MM_OBJ*1.12 ? 'mm-hi' : (mm < MM_OBJ*0.88 ? 'mm-lo' : 'mm-ok');

function nav(d) { wi = Math.min(Math.max(wi+d, 0), WEEKS.length-1); view='week'; di=0; fi=0; render(); }

function weekView(w) {
  let h = '';
  for (const est of ['Delia 1','Delia 2']) {
    const n = w.networks[est]; if (!n) continue;
    h += `<div class="indicators">
      <div class="ind-cell"><div class="ind-label">Riegos</div><div class="ind-value accent">${n.n_riegos}</div></div>
      <div class="ind-cell"><div class="ind-label">mm sem.</div><div class="ind-value">${n.mm_cum}</div></div>
      <div class="ind-cell"><div class="ind-label">mm/riego</div><div class="ind-value ${cls(n.mm_prom)}">${n.mm_prom}</div></div>
      <div class="ind-cell"><div class="ind-label">m³</div><div class="ind-value">${(n.m3/1000).toFixed(1)}k</div></div>
    </div>`;
    const fb = n.n_ferti ? `<span class="badge ferti">🧪 ${n.n_ferti} día${n.n_ferti>1?'s':''} ferti</span>` : '';
    h += `<div class="section-card"><div class="section-header">
      <span class="section-title">${est} ${fb}</span>
      <span class="section-sub">${n.tours.length} turnos · acumulado semana</span></div>
      <div class="tbl"><div class="tbl-row head"><span>Turno</span><span>mm acum.</span><span>Riegos</span><span>mm/riego</span></div>`;
    for (const t of n.tours) {
      h += `<div class="tbl-row"><span>T${t.tour}</span><span>${t.mm}</span><span>${t.n}</span>
        <span class="${cls(t.mmr)}">${t.mmr}</span></div>`;
    }
    h += `<div class="tbl-row total"><span>TOTAL</span><span>${n.mm_cum}</span><span>${n.n_riegos}</span><span>${n.mm_prom}</span></div>`;
    h += `</div></div>`;
  }
  h += `<button class="btn-detail" onclick="view='day';render()">📅 Ver detalle por día →</button>`;
  const nf = fertiDays(w).length;
  h += `<button class="btn-ferti" ${nf?'':'disabled'} onclick="view='ferti';fi=0;render()">🧪 ${nf ? 'Ver fertirriego ('+nf+' día'+(nf>1?'s':'')+') →' : 'Sin fertirriego esta semana'}</button>`;
  return h;
}

function allDays(w) {
  const m = new Map();
  for (const est of ['Delia 1','Delia 2']) {
    const n = w.networks[est]; if (!n) continue;
    for (const d of n.days) if (!m.has(d.fecha)) m.set(d.fecha, d);
  }
  return [...m.values()].sort((a,b)=>a.fecha.localeCompare(b.fecha));
}

function dayView(w) {
  const days = allDays(w);
  if (!days.length) return '<div class="section-card">Sin datos</div>';
  di = Math.min(di, days.length-1);
  const sel = days[di].fecha;
  let h = `<button class="btn-back" onclick="view='week';render()">← Volver a la semana</button><div class="day-chips">`;
  days.forEach((d,i) => {
    const isF = fertiOn(w, d.fecha);
    h += `<div class="chip ${i===di?'on':''} ${isF?'ferti':''}" onclick="di=${i};render()">${isF?'🧪 ':''}${d.dia}<br><span style="font-size:10px">${d.fecha.slice(0,5)}</span></div>`;
  });
  h += `</div>`;
  for (const est of ['Delia 1','Delia 2']) {
    const n = w.networks[est]; if (!n) continue;
    const d = n.days.find(x => x.fecha === sel);
    if (!d) continue;
    h += `<div class="section-card"><div class="section-header">
      <span class="section-title">${est} <span class="badge ${d.modo==='Ferti'?'ferti':''}">${d.modo}</span></span>
      <span class="section-sub">${d.n_tours} turnos · ${d.mm_prom} mm prom · ${d.m3.toLocaleString()} m³</span></div>
      <div class="tbl"><div class="tbl-row head"><span>Turno</span><span>mm</span><span>PSI</span><span>Rev/min</span></div>`;
    for (const t of d.tours) {
      h += `<div class="tbl-row"><span>T${t.t}</span><span class="${cls(t.mm)}">${t.mm}</span>
        <span>${t.p ?? '—'}</span><span>${t.r ?? '—'}</span></div>`;
    }
    h += `<div class="tbl-row total"><span>PROM</span><span>${d.mm_prom}</span><span></span><span></span></div></div></div>`;
  }
  return h;
}

function fertiOn(w, fecha) {
  for (const est of ['Delia 1','Delia 2']) {
    const n = w.networks[est]; if (!n) continue;
    const d = n.days.find(x => x.fecha === fecha && x.ferti);
    if (d) return true;
  }
  return false;
}

function fertiDays(w) {
  const out = [];
  for (const est of ['Delia 1','Delia 2']) {
    const n = w.networks[est]; if (!n) continue;
    for (const d of n.days) if (d.ferti) out.push({est, d});
  }
  return out.sort((a,b)=>a.d.fecha.localeCompare(b.d.fecha));
}

function fertiView(w) {
  const fd = fertiDays(w);
  if (!fd.length) return '<div class="section-card">Sin fertirriego esta semana</div>';
  fi = Math.min(fi, fd.length-1);
  let h = `<button class="btn-back" onclick="view='week';render()">← Volver a la semana</button>`;
  if (fd.length > 1) {
    h += `<div class="day-chips">`;
    fd.forEach((x,i) => {
      h += `<div class="chip ferti ${i===fi?'on':''}" onclick="fi=${i};render()">🧪 ${x.d.dia}<br><span style="font-size:10px">${x.d.fecha.slice(0,5)}</span></div>`;
    });
    h += `</div>`;
  }
  const {est, d} = fd[fi];
  const totm3 = d.tours.reduce((s,t)=>s+t.fm3, 0);
  h += `<div class="indicators">
    <div class="ind-cell"><div class="ind-label">Turnos</div><div class="ind-value">${d.n_tours}</div></div>
    <div class="ind-cell"><div class="ind-label">L/asp prom</div><div class="ind-value accent">${d.fert_lasp}</div></div>
    <div class="ind-cell"><div class="ind-label">m³ total</div><div class="ind-value">${totm3.toFixed(1)}</div></div>
    <div class="ind-cell"><div class="ind-label">Litros</div><div class="ind-value">${(d.fert/1000).toFixed(1)}k</div></div>
  </div>`;
  h += `<div class="section-card"><div class="section-header">
    <span class="section-title">🧪 ${est} — Fertirriego</span>
    <span class="section-sub">${d.dia} ${d.fecha}</span></div>
    <div class="tbl"><div class="tbl-row head"><span>Turno</span><span>L/asp</span><span>m³</span><span>mm agua</span></div>`;
  for (const t of d.tours) {
    h += `<div class="tbl-row"><span>T${t.t}</span><span style="color:#E65100;font-weight:600">${t.lf}</span>
      <span>${t.fm3}</span><span class="${cls(t.mm)}">${t.mm}</span></div>`;
  }
  h += `<div class="tbl-row total"><span>TOTAL</span><span>${d.fert_lasp}</span><span>${totm3.toFixed(1)}</span><span>${d.mm_prom}</span></div>`;
  h += `</div></div>`;
  return h;
}

function render() {
  const w = WEEKS[wi];
  document.getElementById('weekval').textContent = 'S' + String(w.week).padStart(2,'0') + '.' + w.year;
  const ds = allDays(w);
  document.getElementById('weekdates').textContent = ds.length ? ds[0].fecha + ' → ' + ds[ds.length-1].fecha : '';
  document.getElementById('subtitle').textContent =
    view==='week' ? 'Acumulado semanal por turno' : (view==='ferti' ? 'Fertirriego — L/asp y m³' : 'Detalle por día');
  document.getElementById('prev').disabled = wi >= WEEKS.length-1;
  document.getElementById('next').disabled = wi <= 0;
  document.getElementById('content').innerHTML =
    view==='week' ? weekView(w) : (view==='ferti' ? fertiView(w) : dayView(w));
}
render();
</script>
