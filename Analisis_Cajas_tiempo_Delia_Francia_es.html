<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cajas Delia Francia — Reportadas</title>

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  background: #f5f7f5; color: #1a1a1a;
  min-height: 100vh;
}
#wrap { max-width: 480px; margin: 0 auto; padding: 14px; }

#header {
  text-align: center; padding-bottom: 12px;
  border-bottom: 1px solid #e0e0e0; margin-bottom: 14px;
}
#header h1 {
  font-size: 18px; font-weight: 600; margin: 0;
  color: #0277BD;
}
#header .sub { font-size: 12px; color: #888; margin-top: 4px; }

#period-nav {
  display: flex; align-items: stretch; gap: 6px; margin-bottom: 14px;
}
.period-arrow {
  background: white; border: 2px solid #0277BD;
  color: #0277BD; border-radius: 8px; padding: 0 12px;
  font-size: 18px; font-weight: bold; cursor: pointer;
  user-select: none;
}
.period-arrow:disabled { opacity: 0.35; cursor: not-allowed; }
#weekbig {
  flex: 1; background: white; border: 2px solid #0277BD;
  border-radius: 8px; padding: 4px 12px; text-align: center;
}
#weekbig .lab { font-size: 10px; color: #888; text-transform: uppercase; }
#weekbig #weekval {
  font-size: 20px; font-weight: 600; color: #0277BD;
}
#weekbig .dates { font-size: 10px; color: #888; }

.section-card {
  background: white; border: 1px solid #e5e8e5;
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.section-title { font-size: 13px; font-weight: 600; }
.section-sub { font-size: 10px; color: #888; }

.tbl { width: 100%; }
.tbl-row {
  display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap: 4px; padding: 3px 0; font-size: 11px;
}
.tbl-row.head {
  color: #555; border-bottom: 1px solid #eee;
  padding-bottom: 4px; margin-bottom: 4px;
}
.tbl-row.total {
  font-size: 12px; font-weight: 600; color: #0277BD;
  border-top: 1px solid #ccc; margin-top: 2px; padding: 5px 0;
}
.tbl-row > span:nth-child(n+2) { text-align: right; }
.cinta-dot { display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; margin-right: 4px; vertical-align: middle; }

.indicators {
  background: white; border: 1px solid #e5e8e5;
  border-radius: 12px; padding: 10px 12px; margin-bottom: 12px;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
}
.ind-cell { text-align: center; }
.ind-cell + .ind-cell { border-left: 1px solid #eee; }
.ind-label { font-size: 9px; color: #888; text-transform: uppercase; }
.ind-value { font-size: 16px; font-weight: 500; margin-top: 2px; }
.ind-value.accent { color: #0277BD; }

.btn-detail {
  width: 100%; background: #0277BD; color: white;
  border: none; border-radius: 8px; padding: 12px;
  font-size: 13px; font-weight: 500; cursor: pointer;
  margin-bottom: 12px;
}
.btn-back {
  background: transparent; border: none; color: #0277BD;
  font-size: 13px; font-weight: 500; padding: 4px 0;
  margin-bottom: 8px; cursor: pointer;
}

#day-tabs {
  display: flex; gap: 6px; margin-bottom: 12px;
  overflow-x: auto; padding-bottom: 4px;
}
.day-tab {
  background: white; color: #0277BD;
  border: 1px solid #0277BD; border-radius: 8px;
  padding: 8px 6px; font-size: 11px; min-width: 60px;
  cursor: pointer; flex-shrink: 0;
}
.day-tab.active { background: #0277BD; color: white; }
.day-tab.disabled { background: #f0f0f0; color: #ccc;
  border-color: #ddd; cursor: not-allowed; }
.day-tab .day-name { font-size: 9px; text-transform: uppercase; }
.day-tab .day-date { font-weight: 500; }

.empty-msg {
  text-align: center; padding: 20px; color: #888;
  font-size: 12px;
}

.view-week-divider {
  font-size: 11px; color: #888; text-align: center;
  margin: 4px 0 12px; text-transform: uppercase; letter-spacing: 0.4px;
  padding: 6px 0; border-top: 1px solid #0277BD;
}

#footer {
  font-size: 10px; color: #aaa; text-align: center;
  margin-top: 18px; padding: 8px;
}

/* ===== Bouton Info + Modal panneau cumuls ===== */
#header { position: relative; }
#info-btn {
  position: absolute; top: 0; right: 0;
  width: 32px; height: 32px; border-radius: 50%;
  background: white; border: 2px solid #0277BD;
  color: #0277BD; font-size: 16px; font-weight: 700;
  cursor: pointer; padding: 0; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
#info-btn:active { background: #0277BD; color: white; }

#info-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 100;
  justify-content: center; align-items: flex-start;
  padding: 60px 12px 12px;
  -webkit-overflow-scrolling: touch;
  overflow-y: auto;
}
#info-overlay.open { display: flex; }
#info-modal {
  background: white; border-radius: 14px;
  width: 100%; max-width: 460px;
  padding: 14px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  animation: info-pop 0.18s ease-out;
}
@keyframes info-pop {
  from { transform: translateY(-10px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.info-modal-head {
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid #e5e8e5; padding-bottom: 8px; margin-bottom: 10px;
}
.info-modal-title {
  font-size: 14px; font-weight: 600; color: #0277BD;
}
.info-modal-close {
  background: transparent; border: none; font-size: 22px;
  color: #666; cursor: pointer; padding: 0 4px; line-height: 1;
}
.info-tbl {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr 1fr;
  gap: 4px; font-size: 11px;
}
.info-tbl .info-h {
  font-weight: 600; color: #555; text-align: right;
  padding: 6px 4px; border-bottom: 1px solid #e0e0e0;
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.3px;
}
.info-tbl .info-h.first { text-align: left; color: #0277BD; }
.info-tbl .info-lab {
  padding: 7px 4px; font-weight: 500;
  border-bottom: 1px solid #f0f0f0;
}
.info-tbl .info-val {
  padding: 7px 4px; text-align: right;
  border-bottom: 1px solid #f0f0f0;
  font-variant-numeric: tabular-nums;
}
.info-tbl .info-row-last .info-lab,
.info-tbl .info-row-last .info-val { border-bottom: none; }
.info-foot {
  font-size: 10px; color: #888; text-align: center;
  margin-top: 10px; padding-top: 8px;
  border-top: 1px solid #f0f0f0;
}
</style>
</head>

</div>

function fmtNum(v) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    if (v === 0) return '0';
    // entiers separateur fr (point pour milliers, virgule pour decimales)
    if (Number.isInteger(v)) {
      return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    return v.toFixed(2).replace('.', ',');
  }
  return v;
}
function fmtNumDecimal(v, decimals) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    return v.toFixed(decimals != null ? decimals : 2).replace('.', ',');
  }
  return v;
}
function fmtPct(v) {
  if (v === null || v === undefined) return '—';
  return (v * 100).toFixed(1).replace('.', ',') + '%';
}

function getCintaColor(name) {
  const lower = name.toLowerCase();
  for (const [k, c] of Object.entries(CINTA_COLORS)) {
    if (lower.includes(k)) return c;
  }
  return '#666';
}

function render() {
  const week = WEEKS[currentWeekIdx];
  if (!week) return;

  document.getElementById('weekval').textContent =
    `S${String(week.week_num).padStart(2,'0')} / ${week.year}`;

  const ndays = week.days.length;
  if (ndays > 0) {
    const first = week.days[0].date;
    const last = week.days[ndays - 1].date;
    document.getElementById('weekdates').textContent = `${first} — ${last} · ${ndays} días`;
  } else {
    document.getElementById('weekdates').textContent = 'Sin datos';
  }

  const content = document.getElementById('content');
  if (currentDayIdx === -1) {
    content.innerHTML = renderWeekTotalView(week);
  } else {
    content.innerHTML = renderDayView(week, currentDayIdx);
  }

  // Etat boutons navigation
  document.getElementById('period-prev').disabled = (currentWeekIdx >= WEEKS.length - 1);
  document.getElementById('period-next').disabled = (currentWeekIdx <= 0);
}

function enterDayView() {
  const week = WEEKS[currentWeekIdx];
  if (week.days.length > 0) {
    currentDayIdx = 0;
    render();
  }
}

function exitDayView() {
  currentDayIdx = -1;
  render();
}

function setDay(idx) {
  currentDayIdx = idx;
  render();
}

document.getElementById('period-prev').addEventListener('click', () => {
  if (currentWeekIdx < WEEKS.length - 1) {
    currentWeekIdx++; currentDayIdx = -1; render();
  }
});
document.getElementById('period-next').addEventListener('click', () => {
  if (currentWeekIdx > 0) {
    currentWeekIdx--; currentDayIdx = -1; render();
  }
});

function fmtInfoNum(v) {
  if (v === null || v === undefined) return '—';

    if (Number.isInteger(v)) {
      return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    }
    return v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?=,))/g, '.');
  }
  return v;
}
function fmtInfoDecimal(v, decimals) {
  if (v === null || v === undefined) return '—';
  if (typeof v === 'number') {
    return v.toFixed(decimals).replace('.', ',');
  }
  return v;
}
function fmtInfoPct(v) {
  if (v === null || v === undefined) return '—';
  return (v * 100).toFixed(1).replace('.', ',') + '%';
}

    ['Cajas Equiv', 'cajas_equiv', v => fmtInfoNum(v)],
    ['Racimos cortados', 'racimos_nb', v => fmtInfoNum(v)],
    ['Peso medio (kg)', 'peso_moy', v => fmtInfoDecimal(v, 2)],
    ['Ratio', 'ratio', v => fmtInfoDecimal(v, 2)],
    ['Merma', 'merma', v => fmtInfoPct(v)],
  ];
  rows.forEach((r, i) => {
    const last = (i === rows.length - 1) ? ' info-row-last' : '';
    h += `<div class="info-lab${last}">${r[0]}</div>`;
    h += `<div class="info-val${last}">${cell(a, r[1], r[2])}</div>`;
    h += `<div class="info-val${last}">${cell(b, r[1], r[2])}</div>`;
    h += `<div class="info-val${last}">${cell(c, r[1], r[2])}</div>`;
  });
  h += '</div>';
  h += `<div class="info-foot">YTD = del 01/01 a S${String(week.week_num).padStart(2,'0')} · 52 sem glissantes</div>`;
  return h;
}

function openInfo() {
  const week = WEEKS[currentWeekIdx];
  if (!week) return;
  document.getElementById('info-week-label').textContent =
    `S${String(week.week_num).padStart(2,'0')} / ${week.year}`;
  document.getElementById('info-body').innerHTML = renderInfoBody(week);
  document.getElementById('info-overlay').classList.add('open');
}
function closeInfo() {
  document.getElementById('info-overlay').classList.remove('open');
}
document.getElementById('info-btn').addEventListener('click', openInfo);
document.querySelector('.info-modal-close').addEventListener('click', closeInfo);
document.getElementById('info-overlay').addEventListener('click', (e) => {
  if (e.target.id === 'info-overlay') closeInfo();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeInfo();
});

render();
</script>
</body>
</html>
