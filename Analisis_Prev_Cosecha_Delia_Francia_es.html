<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prev. Cosecha — Delia Francia</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  background: #f5f7f5; color: #1a1a1a;
  min-height: 100vh;
  overflow-x: hidden;
}
#wrap { max-width: 480px; margin: 0 auto; padding: 14px; }
#header {
  text-align: center; padding-bottom: 10px;
  border-bottom: 1px solid #e0e0e0; margin-bottom: 12px;
}
#header h1 {
  font-size: 17px; font-weight: 600; margin: 0;
  color: #0277BD;
}
#header .sub { font-size: 11px; color: #888; margin-top: 3px; }

/* Toggle Prev / Suivi — segmented control */
#mode-toggle {
  display: flex; gap: 0; margin-bottom: 12px;
  border: 2px solid #0277BD; border-radius: 10px;
  overflow: hidden; background: white;
}
.mode-btn {
  flex: 1; padding: 10px 8px;
  background: white; border: none;
  font-size: 13px; font-weight: 600;
  color: #0277BD;
  cursor: pointer; user-select: none;
  transition: background 0.15s, color 0.15s;
}
.mode-btn:not(.active):hover {
  background: #E3F2FD;
}
.mode-btn.active {
  background: #0277BD; color: white;
}

/* Carousel header */
#weeknav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.nav-arrow {
  background: white; border: 2px solid #0277BD;
  color: #0277BD; border-radius: 10px;
  width: 40px; height: 40px;
  font-size: 18px; font-weight: bold;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: center;
}
.nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
#weekbig {
  flex: 1; background: white; border: 2px solid #0277BD;
  border-radius: 10px; padding: 6px 10px; text-align: center;
  position: relative;
}
#weekbig .lab {
  font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.5px;
}
#weekbig #weekval {
  font-size: 18px; font-weight: 600; color: #0277BD;
}
#weekbig .badge {
  position: absolute; top: 4px; right: 6px;
  font-size: 9px; padding: 2px 6px; border-radius: 8px;
  background: #fffbe6; color: #b58900; font-weight: 600;
}
#weekbig .badge.current {
  background: #e3fcec; color: #1b7c3a;
}

/* Dots indicator */
#dots {
  display: flex; justify-content: center; gap: 6px; margin-bottom: 14px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #cccccc; transition: all 0.2s;
}
.dot.active {
  background: #0277BD;
  width: 22px; border-radius: 4px;
}

/* Carousel container */
#carousel {
  overflow: hidden; touch-action: pan-y;
}
#carousel-track {
  display: flex;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.slide {
  flex: 0 0 100%; padding: 0 1px;
}

/* Cards */
.card {
  background: white; border: 1px solid #e5e8e5;
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.card-title {
  font-size: 12px; font-weight: 700; color: #1a1a1a;
  margin-bottom: 8px; padding-bottom: 4px;
  border-bottom: 1px solid #eee;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-title .icon { margin-right: 4px; }

/* Compare Table (Prev / Real / Δ%) */
.compare {
  width: 100%; font-size: 12px;
}
.compare .row {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr 0.9fr;
  gap: 6px; padding: 5px 4px;
  align-items: center;
}
.compare .row.head {
  font-size: 10px; color: #1a1a1a; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  border-bottom: 1px solid #eee; padding-bottom: 5px;
}
.compare .row:not(.head):nth-child(even) {
  background: #fafbfc;
}
.compare .lbl { font-weight: 600; color: #1a1a1a; }
.compare .v { text-align: right; font-variant-numeric: tabular-nums; color: #1a1a1a; }
.compare .delta {
  text-align: right; font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 2px 6px; border-radius: 6px; font-size: 11px;
}
.compare .delta.pos { background: #e3fcec; color: #1b7c3a; }
.compare .delta.neg { background: #ffe5e5; color: #b00020; }
.compare .delta.neu { color: #888; }

/* Forecast Table (Prev only) */
.forecast {
  width: 100%; font-size: 12px;
}
.forecast .row {
  display: grid; grid-template-columns: 1.6fr 1fr;
  gap: 6px; padding: 5px 4px;
}
.forecast .row:not(:last-child) { border-bottom: 1px solid #f3f3f3; }
.forecast .lbl { color: #1a1a1a; font-weight: 600; }
.forecast .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: #1a1a1a; }

/* Cohorts — disposition tableau : 1 colonne intitulés à gauche + 6 colonnes valeurs */
.cohorts-table {
  display: grid;
  grid-template-columns: auto repeat(6, 1fr);
  gap: 0; margin-top: 6px;
  border: 1px solid #e5e8e5; border-radius: 6px;
  overflow: hidden;
  font-size: 10px;
}
.cohorts-table .cell {
  padding: 4px 4px;
  text-align: center;
  border-right: 1px solid #f0f0f0;
  border-bottom: 1px solid #f0f0f0;
}
.cohorts-table .cell:last-child { border-right: none; }
.cohorts-table .cell.lbl {
  text-align: right;
  background: #f8f9fa;
  color: #1a1a1a; font-weight: 600;
  padding-right: 6px;
  border-right: 1px solid #e5e8e5;
}
.cohorts-table .cell.head-age {
  background: #f8f9fa; color: #1a1a1a; font-weight: 700;
  font-size: 9px;
}
.cohorts-table .cell.head-pastille {
  background: #f8f9fa;
  padding: 4px 2px;
}
.cohorts-table .cell.head-pastille .pastille {
  display: inline-block; width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.15);
  vertical-align: middle;
}
.cohorts-table .cell.head-name {
  background: #f8f9fa;
  font-size: 8px; color: #555; font-weight: 500;
  padding-bottom: 5px;
}
.cohorts-table .row-bottom .cell { border-bottom: none; }
.cohorts-table .v {
  font-variant-numeric: tabular-nums; font-weight: 600;
  color: #1a1a1a;
}
.cohorts-table .v.zero { color: #bbb; font-weight: 400; }

/* KPI big cards — Racimos & Cajas : titre + lignes Real / Prev */
.kpis {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 10px;
}
.kpi {
  background: white; border: 1px solid #e5e8e5;
  border-radius: 10px; padding: 10px 12px;
}
.kpi .title {
  font-size: 11px; font-weight: 700; color: #1a1a1a;
  text-transform: uppercase; letter-spacing: 0.4px;
  margin-bottom: 6px; padding-bottom: 4px;
  border-bottom: 1px solid #eee; text-align: center;
}
.kpi .ln {
  display: flex; justify-content: center; align-items: baseline;
  gap: 8px; padding: 2px 0;
}
.kpi .ln .k {
  font-size: 10px; color: #555; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.kpi .ln .v {
  font-size: 16px; font-weight: 700; color: #0277BD;
  font-variant-numeric: tabular-nums;
}
.kpi .ln.prev .v {
  font-size: 13px; color: #888; font-weight: 600;
}

/* Avertissement sur semaines de prévision futures */
.warn {
  display: flex; align-items: flex-start; gap: 8px;
  background: #fffbe6; border: 1px solid #f6c84a;
  border-left: 4px solid #e0a800;
  border-radius: 8px; padding: 8px 10px;
  margin-bottom: 10px;
}
.warn-icon {
  font-size: 16px; flex-shrink: 0; line-height: 1.2;
}
.warn-text {
  font-size: 11px; color: #5b4500; line-height: 1.35;
  font-weight: 500;
}
.warn-date {
  margin-top: 4px; padding-top: 4px;
  border-top: 1px solid #f6c84a;
  font-size: 11px; color: #5b4500;
}

/* Footer info */
#footer {
  text-align: center; font-size: 10px; color: #999;
  padding: 8px 0 16px; margin-top: 8px;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <h1>Previsión Cosecha — Delia Francia</h1>
    <div class="sub" id="sub"></div>
  </div>

  <div id="mode-toggle">
    <button class="mode-btn active" id="mode-prev" onclick="setMode('prevision')">
      📊 Previsión
    </button>
    <button class="mode-btn" id="mode-suivi" onclick="setMode('suivi')">
      📋 Seguimiento
    </button>
  </div>

  <div id="weeknav">
    <button class="nav-arrow" id="prev-btn" onclick="navWeek(-1)">‹</button>
    <div id="weekbig">
      <div class="lab">Semana</div>
      <div id="weekval">—</div>
      <div class="badge" id="badge"></div>
    </div>
    <button class="nav-arrow" id="next-btn" onclick="navWeek(1)">›</button>
  </div>

  <div id="dots"></div>

  <div id="carousel">
    <div id="carousel-track"></div>
  </div>

  
<style>
.et-card{background:#fff;border-radius:14px;box-shadow:0 1px 6px rgba(0,0,0,.06);padding:12px;margin:0 0 12px}
.et-ttl{font-weight:800;font-size:14px;margin-bottom:8px}
.et-seg{display:flex;background:#eef1ee;border-radius:9px;padding:3px;margin-bottom:8px}
.et-seg div{flex:1;text-align:center;font-size:12px;padding:6px;border-radius:7px;color:#555;font-weight:600;cursor:pointer}
.et-seg div.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.et-kpi{display:flex;justify-content:space-around;text-align:center;margin-bottom:2px}
.et-kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}.et-kpi span{font-size:10.5px;color:#888}
.et-leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:10.5px;color:#555;margin-top:4px;justify-content:center}
.et-leg i{display:inline-block;width:13px;height:4px;border-radius:2px;margin-right:4px;vertical-align:middle}
.et-sel{text-align:center;font-size:11.5px;color:#333;margin-top:4px;min-height:16px}
.et-hint{color:#999;font-size:10.5px;margin-top:6px;line-height:1.4;text-align:center}
</style>
<script>
var ET_ST={};
function etFmt(v,d){if(v==null)return '—';return Number(v).toLocaleString('es-ES',{minimumFractionDigits:d||0,maximumFractionDigits:d||0})}
function etRender(D,col,id){
  id=id||'et';if(!D||!D.hist||!D.hist.length)return '';
  var st=ET_ST[id]||(ET_ST[id]={n:52,sel:null});
  return '<div class="et-card" id="'+id+'">'+etInner(D,col,id)+'</div>'}
function etInner(D,col,id){
  var st=ET_ST[id],H=D.hist.slice(-st.n),F=D.fut||[],P=H.concat(F),n=P.length,nh=H.length,h=D.hist[D.hist.length-1];
  var W=440,pl=34,pr=42,X=function(i){return pl+i*(W-pl-pr)/Math.max(1,n-1)};
  var g='<svg viewBox="0 0 '+W+' 300" width="100%" style="display:block;touch-action:pan-y" onclick="etTap(event,\''+id+'\')">';
  function path(k,Y,a,b,dash,c,w){var d='';for(var i=a;i<=b;i++){var v=P[i]&&P[i][k];if(v==null)continue;d+=(d?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1)}
    return d?'<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="4 3"':'')+' stroke-linejoin="round"/>':''}
  function zone(t,b){return F.length?'<rect x="'+(X(nh-1)+2).toFixed(1)+'" y="'+t+'" width="'+(X(n-1)-X(nh-1)+4).toFixed(1)+'" height="'+(b-t)+'" fill="#FFF3E0"/>':''}
  // panneau 1 : edad (gauche) / T13 (droite, inversée)
  var ages=P.map(function(p){return p.age}).filter(function(v){return v!=null}),ts=P.map(function(p){return p.T13}).filter(function(v){return v!=null});
  var amin=Math.floor((Math.min.apply(null,ages)-.15)*2)/2,amax=Math.ceil((Math.max.apply(null,ages)+.15)*2)/2;
  var tmin=Math.floor((Math.min.apply(null,ts)-15)/50)*50,tmax=Math.ceil((Math.max.apply(null,ts)+15)/50)*50;
  var t=10,b=170,YA=function(a){return t+(amax-a)/(amax-amin)*(b-t)},YT=function(v){return t+(v-tmin)/(tmax-tmin)*(b-t)};
  g+=zone(t,b);
  for(var a=amin;a<=amax+1e-9;a+=.5)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+YA(a).toFixed(1)+'" y2="'+YA(a).toFixed(1)+'" stroke="#eef1ee"/><text x="'+(pl-4)+'" y="'+(YA(a)+3).toFixed(1)+'" font-size="9" fill="'+col+'" text-anchor="end">'+etFmt(a,1)+'</text>';
  var stp=(tmax-tmin)>250?100:50;for(var v=tmin;v<=tmax;v+=stp)g+='<text x="'+(W-pr+4)+'" y="'+(YT(v)+3).toFixed(1)+'" font-size="9" fill="#E65100">'+etFmt(v)+'</text>';
  g+=path('T13',YT,0,nh-1,0,'#E65100',1.8)+path('T13',YT,nh-1,n-1,1,'#E65100',1.8);
  g+=path('age',YA,0,nh-1,0,col,2.4)+path('age',YA,nh-1,n-1,1,col,2.4);
  for(var i=nh;i<n;i++)g+='<circle cx="'+X(i).toFixed(1)+'" cy="'+YA(P[i].age).toFixed(1)+'" r="2.6" fill="#fff" stroke="'+col+'" stroke-width="1.5"/>';
  if(F.length)g+='<text x="'+(W-pr-2)+'" y="'+(t+10)+'" font-size="9" fill="#E65100" text-anchor="end">prev.</text>';
  // panneau 2 : °C·j reçus à la récolte + plafond
  var dds=P.map(function(p){return p.DD}).filter(function(v){return v!=null}).concat([D.dd_max]);
  var dmin=Math.floor((Math.min.apply(null,dds)-20)/50)*50,dmax=Math.ceil((Math.max.apply(null,dds)+20)/50)*50;
  var t2=190,b2=280,YD=function(v){return b2-(v-dmin)/(dmax-dmin)*(b2-t2)};
  g+=zone(t2,b2)+'<rect x="'+pl+'" y="'+YD(D.dd_max).toFixed(1)+'" width="'+(W-pl-pr)+'" height="'+(b2-YD(D.dd_max)).toFixed(1)+'" fill="#E8F5E9" opacity=".8"/>';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+YD(D.dd_max).toFixed(1)+'" y2="'+YD(D.dd_max).toFixed(1)+'" stroke="#C62828" stroke-dasharray="4 3"/>';
  g+='<text x="'+(pl+2)+'" y="'+(YD(D.dd_max)-3).toFixed(1)+'" font-size="9" fill="#C62828">máx '+etFmt(D.dd_max)+' °C·j</text>';
  for(var v2=dmin;v2<=dmax;v2+=50)if((v2-dmin)%100===0)g+='<text x="'+(W-pr+4)+'" y="'+(YD(v2)+3).toFixed(1)+'" font-size="9" fill="#8D6E63">'+etFmt(v2)+'</text>';
  g+=path('DD',YD,0,nh-1,0,'#8D6E63',1.8)+path('DD',YD,nh-1,n-1,1,'#8D6E63',1.8);
  // axe des semaines
  var lab=n>80?[1,27]:[1,14,27,40];
  P.forEach(function(p,i){if(lab.indexOf(p.wk)>=0)g+='<line x1="'+X(i).toFixed(1)+'" x2="'+X(i).toFixed(1)+'" y1="10" y2="280" stroke="#f1f3f1"/><text x="'+X(i).toFixed(1)+'" y="296" font-size="9" fill="#888" text-anchor="middle">S'+String(p.wk).padStart(2,'0')+'/'+String(p.yr).slice(2)+'</text>'});
  if(st.sel!=null&&st.sel<n){var xs=X(st.sel).toFixed(1);g+='<line x1="'+xs+'" x2="'+xs+'" y1="10" y2="280" stroke="#455A64" stroke-dasharray="3 3"/>'}
  g+='</svg>';
  var s=st.sel!=null&&P[st.sel]?P[st.sel]:null;
  var seg='<div class="et-seg">'+[[52,'1 año'],[156,'3 años']].map(function(o){return '<div class="'+(st.n===o[0]?'on':'')+'" style="'+(st.n===o[0]?'color:'+col:'')+'" onclick="ET_ST[\''+id+'\'].n='+o[0]+';ET_ST[\''+id+'\'].sel=null;etRedraw(\''+id+'\')">'+o[1]+'</div>'}).join('')+'</div>';
  return '<div class="et-ttl" style="color:'+col+'">⏱️ Edad de cosecha y temperatura</div>'+seg+
    '<div class="et-kpi"><div><b style="color:'+col+'">'+etFmt(h.age,2)+'</b><span>edad prom. S'+String(h.wk).padStart(2,'0')+' (sem)</span></div>'+
    '<div><b style="color:#E65100">'+etFmt(h.T13)+'</b><span>T13Sem (°C·j)</span></div>'+
    '<div><b style="color:#8D6E63">'+etFmt(h.DD)+'</b><span>°C·j a la cosecha</span></div></div>'+g+
    '<div class="et-sel">'+(s?'<b>S'+String(s.wk).padStart(2,'0')+'/'+s.yr+'</b>'+(st.sel>=nh?' (prev.)':'')+' · edad <b style="color:'+col+'">'+etFmt(s.age,2)+'</b> · T13 <b style="color:#E65100">'+etFmt(s.T13)+'</b> · °C·j <b style="color:#8D6E63">'+etFmt(s.DD)+'</b> · '+etFmt(s.rac)+' rac.':'<span style="color:#aaa">tocar el gráfico para ver una semana</span>')+'</div>'+
    '<div class="et-leg"><span><i style="background:'+col+'"></i>edad prom. cosecha</span><span><i style="background:#E65100"></i>T13Sem (eje der. invertido)</span><span><i style="background:#8D6E63"></i>°C·j recibidos a la cosecha</span><span><i style="background:#E8F5E9;border:1px solid #C8E6C9"></i>bajo el máx.</span></div>'+
    '<div class="et-hint">r = '+etFmt(D.r,2)+' · +100 °C·j de T13 → '+(D.pente100>0?'+':'')+etFmt(D.pente100,2)+' sem'+(F.length?' · punteado = previsión Prev. Cosecha S'+String(F[0].wk).padStart(2,'0')+'–S'+String(F[F.length-1].wk).padStart(2,'0'):'')+
    '<br>semanas contadas a la ecuatoriana (sem. de enfunde = 1) · °C·j = Σ T efectiva sobre la edad de cada racimo · datos meteo hasta el '+D.datos_hasta+'</div>'}
var ET_D={},ET_C={};
function etMount(D,col,id){id=id||'et';ET_D[id]=D;ET_C[id]=col;return etRender(D,col,id)}
function etRedraw(id){var el=document.getElementById(id);if(el)el.innerHTML=etInner(ET_D[id],ET_C[id],id)}
function etTap(ev,id){var sv=ev.currentTarget,r=sv.getBoundingClientRect(),D=ET_D[id],st=ET_ST[id];
  var n=D.hist.slice(-st.n).length+(D.fut||[]).length,x=(ev.clientX-r.left)/r.width*440;

  let html = '<div class="card"><div class="card-title">📊 Previsto vs Real</div>';
  html += '<div class="compare">';
  html += '<div class="row head"><div>Indicador</div><div class="v">Previsto</div><div class="v">Real</div><div class="v">Δ%</div></div>';
  for (const l of lines) {
    const fmtV = (v) => v === null || v === undefined ? '—' : fmtNum(v, l.dec) + (l.suffix || '');
    html += '<div class="row">';
    html += '<div class="lbl">' + l.key + '</div>';
    html += '<div class="v">' + fmtV(l.p) + '</div>';
    html += '<div class="v">' + fmtV(l.r) + '</div>';
    html += deltaCell(l.p, l.r);
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderForecast(week) {
  const lines = [
    { key: 'Racimos previstos',  v: week.tot_cos,        dec: 0 },
    { key: 'Peso prom. (kg/rac)',v: week.poids_moy_prev, dec: 2 },
    { key: 'Peso total (kg)',    v: week.poids_total,    dec: 0 },
    { key: 'Merma %',            v: week.merma_pct,      dec: 1 },
    { key: 'Cajas previstas',    v: week.cajas,          dec: 0 },
    { key: 'Ratio caj/rac',      v: week.ratio_caj_rac,  dec: 2 },
    { key: 'Edad prom.',         v: week.edad_prom,      dec: 2 },
  ];
  let html = '<div class="card"><div class="card-title">🔮 Previsión semanal</div>';
  html += '<div class="forecast">';
  for (const l of lines) {
    const v = l.v === null || l.v === undefined ? '—' : fmtNum(l.v, l.dec);
    html += '<div class="row"><div class="lbl">' + l.key + '</div><div class="v">' + v + '</div></div>';
  }
  html += '</div></div>';
  return html;
}

function renderCohorts(week) {
  const cohortes = week.cohortes || [];
  let html = '<div class="card"><div class="card-title">🎨 Cohortes por edad</div>';
  html += '<div class="cohorts-table">';

  // Row 1 : âges (+9sem...) — 1ère colonne vide
  html += '<div class="cell lbl"></div>';
  for (const c of cohortes) {
    html += '<div class="cell head-age">+' + c.age_app + 'sem</div>';
  }

  // Row 2 : pastilles couleur — 1ère colonne vide
  html += '<div class="cell lbl"></div>';
  for (const c of cohortes) {
    const col = cintaColor(c.cinta);
    html += '<div class="cell head-pastille">'
         + '<span class="pastille" style="background:' + col + '"></span></div>';
  }

  // Row 3 : nom couleur (Azul, Verde...) — 1ère colonne vide
  html += '<div class="cell lbl"></div>';
  for (const c of cohortes) {
    html += '<div class="cell head-name">' + (c.cinta || '?') + '</div>';
  }

  // Row : Suma T° + flecha de tendencia del ciclo (▲ acorta / ▼ alarga)
  const _pdir = (DATA.panneau && DATA.panneau.direction) || '';
  const _arr = (_pdir === 'RACCOURCISSEMENT') ? ' ▲' : ((_pdir === 'RALLONGEMENT') ? ' ▼' : '');
  html += '<div class="cell lbl">Suma T°</div>';
  for (const c of cohortes) {
    const st = (c.sum_tef !== undefined && c.sum_tef !== null) ? (fmtNum(c.sum_tef) + _arr) : '—';
    html += '<div class="cell"><span class="v" style="opacity:.65">' + st + '</span></div>';
  }

  // Row : Enfundes (floración inicial)
  html += '<div class="cell lbl">Enfundes</div>';
  for (const c of cohortes) {
    html += '<div class="cell"><span class="v" style="opacity:.65">' + fmtNum(c.enfundes) + '</span></div>';
  }

  // Row : Ya cosechado (floración − saldo inicial)
  html += '<div class="cell lbl">Ya cosech.</div>';
  for (const c of cohortes) {
    const dj = (c.deja_recolte !== undefined && c.deja_recolte !== null) ? c.deja_recolte : ((c.enfundes||0) - (c.saldo_ini||0));
    html += '<div class="cell"><span class="v" style="opacity:.65">' + fmtNum(dj) + '</span></div>';
  }

  // Row 4 : Saldo Inicial
  html += '<div class="cell lbl">Saldo ini</div>';
  for (const c of cohortes) {
    const cls = (c.saldo_ini === 0 ? 'v zero' : 'v');
    html += '<div class="cell"><span class="' + cls + '">' + fmtNum(c.saldo_ini) + '</span></div>';
  }

  // Row 5 : Cosecha (avec marqueur visuel selon flags)
  // 🛑 = blocked_now (interdit cette sem)
  // ⚠️ = forced_max_age (soldage d'âge max)
  // ⛔ = forced_block (sem+1 bloquée → solder maintenant)
  html += '<div class="cell lbl">Cosecha</div>';
  for (const c of cohortes) {
    let mark = '';
    if      (c.blocked_now)    mark = ' 🛑';
    else if (c.forced_max_age) mark = ' ⚠️';
    else if (c.forced_block)   mark = ' ⛔';
    const cls = (c.cosecha === 0 ? 'v zero' : 'v');
    html += '<div class="cell"><span class="' + cls + '">'
         + fmtNum(c.cosecha) + mark + '</span></div>';
  }

  // Row 6 : Saldo Final (dernière ligne, pas de border-bottom)
  html += '<div class="cell lbl row-bottom">Saldo fin</div>';
  for (const c of cohortes) {
    const cls = (c.saldo_fin === 0 ? 'v zero' : 'v');
    html += '<div class="cell row-bottom"><span class="' + cls + '">' + fmtNum(c.saldo_fin) + '</span></div>';
  }

  html += '</div></div>';
  return html;
}

function renderKpis(week) {
  const real = week.real || {};
  const useReal = real.tot_cos !== undefined;   // passé + S0 (réel dispo)
  let html = '<div class="kpis">';

  // Card Racimos
  html += '<div class="kpi"><div class="title">Racimos</div>';
  if (useReal) {
    html += '<div class="ln"><span class="k">Real</span><span class="v">' + fmtNum(real.tot_cos) + '</span></div>';
    html += '<div class="ln prev"><span class="k">Prev</span><span class="v">' + fmtNum(week.tot_cos) + '</span></div>';
  } else {
    html += '<div class="ln"><span class="k">Prev</span><span class="v">' + fmtNum(week.tot_cos) + '</span></div>';
  }
  html += '</div>';

  // Card Cajas
  html += '<div class="kpi"><div class="title">Cajas</div>';
  if (useReal) {
    html += '<div class="ln"><span class="k">Real</span><span class="v">' + fmtNum(real.cajas) + '</span></div>';
    html += '<div class="ln prev"><span class="k">Prev</span><span class="v">' + fmtNum(week.cajas) + '</span></div>';
  } else {
    html += '<div class="ln"><span class="k">Prev</span><span class="v">' + fmtNum(week.cajas) + '</span></div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function renderSlide(week) {
  let html = '<div class="slide">';
  html += renderKpis(week);
  if (week.real) {   // comparaison prévu/réel : passé ET semaine en cours
    html += renderCompare(week);
  } else {
    // Bandeau d'avertissement sur les semaines de prévision futures
    let dateStr = '';
    if (DATA.last_record_date) {
      try {
        const d = new Date(DATA.last_record_date + 'T00:00:00');
        dateStr = d.toLocaleDateString('es-ES', {
          day: '2-digit', month: 'long', year: 'numeric'
        });
      } catch (e) { dateStr = DATA.last_record_date; }
    }
    html += '<div class="warn">';
    html += '<div class="warn-icon">⚠️</div>';
    html += '<div class="warn-text">';
    html += 'Estos datos son una proyección basada en los últimos registros validados. ';
    html += 'Pueden variar significativamente con la realidad.';
    if (dateStr) {
      html += '<div class="warn-date">Último registro: <b>' + dateStr + '</b></div>';
    }
    html += '</div>';
    html += '</div>';
    html += renderForecast(week);
  }
  html += renderCohorts(week);
  html += '</div>';
  return html;
}

function renderAll() {
  // Header sub : phase / slope / corr depuis le bloc DATA courant
  const phase = DATA.phase || '';
  const slope = DATA.slope !== null && DATA.slope !== undefined ? DATA.slope.toFixed(3) : '';
  const ratio_g = DATA.ratio_global !== null && DATA.ratio_global !== undefined
    ? ' · Corr: ' + ((DATA.ratio_global - 1) * 100).toFixed(1) + '%'
    : '';
  const pann = DATA.panneau || {};
  const DIR_ES = {'RALLONGEMENT':'ALARGAMIENTO ▲','RACCOURCISSEMENT':'ACORTAMIENTO ▼','PLATEAU HAUT':'MESETA ALTA','PLATEAU BAS':'MESETA BAJA','TRANSITION':'TRANSICIÓN'};
  let cicloStr = '';
  if (pann.direction) {
    cicloStr = ' · Ciclo: ' + (DIR_ES[pann.direction] || pann.direction);
    if (pann.niveau_dd) cicloStr += ' (' + Math.round(pann.niveau_dd) + ' °C·j/sem)';
  }
  document.getElementById('sub').textContent =
    phase + (slope ? ' (slope=' + slope + ')' : '') + ratio_g + cicloStr;

  // Render slides
  const track = document.getElementById('carousel-track');
  track.innerHTML = WEEKS.map(renderSlide).join('');

  // Dots
  const dots = document.getElementById('dots');
  dots.innerHTML = WEEKS.map((_, i) => '<div class="dot" data-i="' + i + '"></div>').join('');
  dots.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => goTo(parseInt(d.dataset.i)));
  });

  // Footer (generated_at peut venir du bloc finca ou du wrapper)
  const gen = DATA.generated_at || (DATA_PREV && DATA_PREV.generated_at) || '';
  document.getElementById('gen').textContent = gen;

  // Démarrer sur la semaine en cours (start_idx) : le passé est AVANT (flèche ‹)
  CURRENT = (DATA.start_idx || 0);
  goTo(CURRENT);
}

function setMode(m) {
  if (m === MODE) return;
  MODE = m;
  DATA  = (m === 'suivi') ? DATA_SUIVI : DATA_PREV;
  WEEKS = DATA.weeks || [];
  // Toggle visuel des boutons
  document.getElementById('mode-prev').classList.toggle('active',  m === 'prevision');
  document.getElementById('mode-suivi').classList.toggle('active', m === 'suivi');
  renderAll();
}

function init() {
  // Par défaut : mode 'prevision' (vue prospective S0→S+3)
  // DATA / WEEKS sont déjà initialisés sur DATA_PREV plus haut.
  renderAll();
}

function goTo(i) {
  if (i < 0 || i >= WEEKS.length) return;
  CURRENT = i;
  const track = document.getElementById('carousel-track');
  track.style.transform = 'translateX(-' + (i * 100) + '%)';

  const w = WEEKS[i];
  document.getElementById('weekval').textContent =
    'S' + String(w.sem).padStart(2, '0') + '.' + w.yr;
  const badge = document.getElementById('badge');
  if (w.is_current) {
    badge.textContent = 'ACTUAL';
    badge.className = 'badge current';
  } else {
    badge.textContent = '+' + w.delta;
    badge.className = 'badge';
  }

  document.getElementById('prev-btn').disabled = (i === 0);
  document.getElementById('next-btn').disabled = (i === WEEKS.length - 1);

  document.querySelectorAll('.dot').forEach((d, di) => {
    d.classList.toggle('active', di === i);
  });
}

function navWeek(dir) { goTo(CURRENT + dir); }

// Touch swipe
let touchStartX = 0, touchEndX = 0;
document.getElementById('carousel').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
document.getElementById('carousel').addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  const dx = touchEndX - touchStartX;
  if (Math.abs(dx) > 40) {
    navWeek(dx < 0 ? 1 : -1);
  }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navWeek(-1);
  else if (e.key === 'ArrowRight') navWeek(1);
});

init();
</script>
</body>
</html>
