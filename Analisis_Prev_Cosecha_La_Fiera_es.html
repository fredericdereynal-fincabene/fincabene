<title>Prev. Cosecha — La Fiera</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  font-family: -apple-system, Segoe UI, Roboto, sans-serif;
  background: #f5f7f5; color: #1a1a1a;
  min-height: 100vh;
  overflow-x: hidden;
}
#wrap { max-width: 480px; margin: 0 auto; padding: 14px; }
#header {
  text-align: center; padding-bottom: 10px;
  border-bottom: 1px solid #e0e0e0; margin-bottom: 12px;
}
#header h1 {
  font-size: 17px; font-weight: 600; margin: 0;
  color: #2E7D32;
}
#header .sub { font-size: 11px; color: #888; margin-top: 3px; }

/* Toggle Prev / Suivi — segmented control */
#mode-toggle {
  display: flex; gap: 0; margin-bottom: 12px;
  border: 2px solid #2E7D32; border-radius: 10px;
  overflow: hidden; background: white;
}
.mode-btn {
  flex: 1; padding: 10px 8px;
  background: white; border: none;
  font-size: 13px; font-weight: 600;
  color: #2E7D32;
  cursor: pointer; user-select: none;
  transition: background 0.15s, color 0.15s;
}
.mode-btn:not(.active):hover {
  background: #E8F5E9;
}
.mode-btn.active {
  background: #2E7D32; color: white;
}

/* Carousel header */
#weeknav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
}
.nav-arrow {
  background: white; border: 2px solid #2E7D32;
  color: #2E7D32; border-radius: 10px;
  width: 40px; height: 40px;
  font-size: 18px; font-weight: bold;
  cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: center;
}
.nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
#weekbig {
  flex: 1; background: white; border: 2px solid #2E7D32;
  border-radius: 10px; padding: 6px 10px; text-align: center;
  position: relative;
}
#weekbig .lab {
  font-size: 9px; color: #888; text-transform: uppercase; letter-spacing: 0.5px;
}
#weekbig #weekval {
  font-size: 18px; font-weight: 600; color: #2E7D32;
}
#weekbig .badge {
  position: absolute; top: 4px; right: 6px;
  font-size: 9px; padding: 2px 6px; border-radius: 8px;
  background: #fffbe6; color: #b58900; font-weight: 600;
}
#weekbig .badge.current {
  background: #e3fcec; color: #1b7c3a;
}

/* Dots indicator */
#dots {
  display: flex; justify-content: center; gap: 6px; margin-bottom: 14px;
}
.dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #cccccc; transition: all 0.2s;
}
.dot.active {
  background: #2E7D32;
  width: 22px; border-radius: 4px;
}

/* Carousel container */
#carousel {
  overflow: hidden; touch-action: pan-y;
}
#carousel-track {
  display: flex;
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.slide {
  flex: 0 0 100%; padding: 0 1px;
}

/* Cards */
.card {
  background: white; border: 1px solid #e5e8e5;
  border-radius: 12px; padding: 12px; margin-bottom: 10px;
}
.card-title {
  font-size: 12px; font-weight: 700; color: #1a1a1a;
  margin-bottom: 8px; padding-bottom: 4px;
  border-bottom: 1px solid #eee;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.card-title .icon { margin-right: 4px; }

/* Compare Table (Prev / Real / Δ%) */
.compare {
  width: 100%; font-size: 12px;
}
.compare .row {
  display: grid; grid-template-columns: 1.6fr 1fr 1fr 0.9fr;
  gap: 6px; padding: 5px 4px;
  align-items: center;
}
.compare .row.head {
  font-size: 10px; color: #1a1a1a; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.4px;
  border-bottom: 1px solid #eee; padding-bottom: 5px;
}
.compare .row:not(.head):nth-child(even) {
  background: #fafbfc;
}
.compare .lbl { font-weight: 600; color: #1a1a1a; }
.compare .v { text-align: right; font-variant-numeric: tabular-nums; color: #1a1a1a; }
.compare .delta {
  text-align: right; font-weight: 600;
  font-variant-numeric: tabular-nums;
  padding: 2px 6px; border-radius: 6px; font-size: 11px;
}
.compare .delta.pos { background: #e3fcec; color: #1b7c3a; }
.compare .delta.neg { background: #ffe5e5; color: #b00020; }
.compare .delta.neu { color: #888; }

/* Forecast Table (Prev only) */
.forecast {
  width: 100%; font-size: 12px;
}
.forecast .row {
  display: grid; grid-template-columns: 1.6fr 1fr;
  gap: 6px; padding: 5px 4px;
}
.forecast .row:not(:last-child) { border-bottom: 1px solid #f3f3f3; }
.forecast .lbl { color: #1a1a1a; font-weight: 600; }
.forecast .v { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; color: #1a1a1a; }

/* Cohorts — disposition tableau : 1 colonne intitulés à gauche + 6 colonnes valeurs */
.cohorts-table {
  display: grid;
  grid-template-columns: auto repeat(6, 1fr);
  gap: 0; margin-top: 6px;
  border: 1px solid #e5e8e5; border-radius: 6px;
  overflow: hidden;
  font-size: 10px;
}
.cohorts-table .cell {
  padding: 4px 4px;
  text-align: center;
  border-right: 1px solid #f0f0f0;
  border-bottom: 1px solid #f0f0f0;
}
.cohorts-table .cell:last-child { border-right: none; }
.cohorts-table .cell.lbl {
  text-align: right;
  background: #f8f9fa;
  color: #1a1a1a; font-weight: 600;
  padding-right: 6px;
  border-right: 1px solid #e5e8e5;
}
.cohorts-table .cell.head-age {
  background: #f8f9fa; color: #1a1a1a; font-weight: 700;
  font-size: 9px;
}
.cohorts-table .cell.head-pastille {
  background: #f8f9fa;
  padding: 4px 2px;
}
.cohorts-table .cell.head-pastille .pastille {
  display: inline-block; width: 14px; height: 14px;
  border-radius: 50%;
  border: 1px solid rgba(0,0,0,0.15);
  vertical-align: middle;
}
.cohorts-table .cell.head-name {
  background: #f8f9fa;
  font-size: 8px; color: #555; font-weight: 500;
  padding-bottom: 5px;
}
.cohorts-table .row-bottom .cell { border-bottom: none; }
.cohorts-table .v {
  font-variant-numeric: tabular-nums; font-weight: 600;
  color: #1a1a1a;
}
.cohorts-table .v.zero { color: #bbb; font-weight: 400; }

/* KPI big cards — Racimos & Cajas : titre + lignes Real / Prev */
.kpis {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-bottom: 10px;
}
.kpi {
  background: white; border: 1px solid #e5e8e5;
  border-radius: 10px; padding: 10px 12px;
}
.kpi .title {
  font-size: 11px; font-weight: 700; color: #1a1a1a;
  text-transform: uppercase; letter-spacing: 0.4px;
  margin-bottom: 6px; padding-bottom: 4px;
  border-bottom: 1px solid #eee; text-align: center;
}
.kpi .ln {
  display: flex; justify-content: center; align-items: baseline;
  gap: 8px; padding: 2px 0;
}
.kpi .ln .k {
  font-size: 10px; color: #555; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.kpi .ln .v {
  font-size: 16px; font-weight: 700; color: #2E7D32;
  font-variant-numeric: tabular-nums;
}
.kpi .ln.prev .v {
  font-size: 13px; color: #888; font-weight: 600;
}

/* Avertissement sur semaines de prévision futures */
.warn {
  display: flex; align-items: flex-start; gap: 8px;
  background: #fffbe6; border: 1px solid #f6c84a;
  border-left: 4px solid #e0a800;
  border-radius: 8px; padding: 8px 10px;
  margin-bottom: 10px;

.warn-icon {
  font-size: 16px; flex-shrink: 0; line-height: 1.2;

.warn-text {
  font-size: 11px; color: #5b4500; line-height: 1.35;
  font-weight: 500;
}
.warn-date {
  margin-top: 4px; padding-top: 4px;
  border-top: 1px solid #f6c84a;
  font-size: 11px; color: #5b4500;
}

/* Footer info */
#footer {
  text-align: center; font-size: 10px; color: #999;
  padding: 8px 0 16px; margin-top: 8px;
}

0, "cosecha": 0, "saldo_fin": 0, "poids_pred": 29.64, "sum_tef": 1186, "forced_max_age": false, "min_cos": 0, "forced_block": false, "blocked_now": false, "blocked_now_reason": null, "block_reason": "T°+0%hist"}, {"age_id": 13, "age_app": 14, "cinta": "Roja", "enfundes": 5238, "saldo_ini": 0, "deja_recolte": 5238, "cosecha": 0, "saldo_fin": 0, "poids_pred": 30.11, "sum_tef": 1280, "forced_max_age": false, "min_cos": 0, "forced_block": false, "blocked_now": true, "blocked_now_reason": "T°+0%hist(guia)", "block_reason": "0%hist"}], "real": {"tot_cos": 4303, "poids_total": 132363, "poids_moy": 30.76, "cajas": 5780, "merma_pct": 6.6, "ratio_caj_rac": 1.3432}}], "panneau": {"niveau_dd": 91.5, "pente_longue": 0.06, "pente_courte": 0.07, "proj_dd": [92], "direction": "PLATEAU HAUT"}};
const CINTA_COLORS = {"roja": "#C92D2D", "rojo": "#C92D2D", "cafe": "#6F4E37", "café": "#6F4E37", "amarila": "#DAA520", "amarilla": "#DAA520", "amarillo": "#DAA520", "amar": "#DAA520", "verde": "#2B8A3E", "azul": "#2E7D32", "blanca": "#999999", "blanco": "#999999", "naranja": "#E65100", "turquesa": "#1ABC9C", "lila": "#9B59B6", "morada": "#9B59B6", "rosa": "#E91E63", "negra": "#1a1a1a", "?": "#cccccc"};
// État courant : 'prevision' ou 'suivi' (par défaut prévision = vue prospective)
let MODE = 'prevision';
// DATA / WEEKS sont réassignés à chaque setMode() pour pointer sur le bon bloc
let DATA  = DATA_PREV;
let WEEKS = DATA.weeks || [];
let CURRENT = 0;

const fmtNum = (v, dec = 0) => {
  if (v === null || v === undefined || v === '') return '—';
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return n.toLocaleString('es-ES', {
    minimumFractionDigits: dec,
    maximumFractionDigits: dec,
    useGrouping: true
  });
};
const fmtPct = (v, dec = 1, signed = false) => {
  if (v === null || v === undefined) return '—';
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return (signed && n >= 0 ? '+' : '') + n.toFixed(dec) + '%';
};
const fmtDeltaPct = (prev, real, dec = 1) => {
  if (prev === null || real === null || prev === undefined || real === undefined) return null;
  if (prev === 0) return null;
  return ((real - prev) / prev) * 100;
};
const cintaColor = (name) => {
  if (!name) return '#cccccc';
  const k = String(name).toLowerCase().trim();
  return CINTA_COLORS[k] || '#cccccc';
};

function deltaCell(prev, real, fmtFn = (v) => fmtNum(v, 0)) {
  const pct = fmtDeltaPct(prev, real);
  if (pct === null) return '<div class="delta neu">—</div>';
  const cls = pct >= 0 ? 'pos' : 'neg';
  const sign = pct >= 0 ? '+' : '';
  return '<div class="delta ' + cls + '">' + sign + pct.toFixed(1) + '%</div>';
}

function renderCompare(week) {
  const prev = week;
  const real = week.real || {};
  const lines = [
    { key: 'Racimos',      p: prev.tot_cos,        r: real.tot_cos,        dec: 0 },
    { key: 'Peso prom.',   p: prev.poids_moy_prev, r: real.poids_moy,      dec: 2, suffix: ' kg' },
    { key: 'Cajas',        p: prev.cajas,          r: real.cajas,          dec: 0 },
    { key: 'Merma',        p: prev.merma_pct,      r: real.merma_pct,      dec: 1, suffix: ' %' },
    { key: 'Ratio caj/rac',p: prev.ratio_caj_rac,  r: real.ratio_caj_rac,  dec: 2 },
  ];
  let html = '<div class="card"><div class="card-title">📊 Previsto vs Real</div>';
  html += '<div class="compare">';
  html += '<div class="row head"><div>Indicador</div><div class="v">Previsto</div><div class="v">Real</div><div class="v">Δ%</div></div>';
  for (const l of lines) {
    const fmtV = (v) => v === null || v === undefined ? '—' : fmtNum(v, l.dec) + (l.suffix || '');
    html += '<div class="row">';
    html += '<div class="lbl">' + l.key + '</div>';
    html += '<div class="v">' + fmtV(l.p) + '</div>';
    html += '<div class="v">' + fmtV(l.r) + '</div>';
    html += deltaCell(l.p, l.r);
    html += '</div>';
  }
  html += '</div></div>';
  return html;
}

function renderForecast(week) {
  const lines = [
    { key: 'Racimos previstos',  v: week.tot_cos,        dec: 0 },
    { key: 'Peso prom. (kg/rac)',v: week.poids_moy_prev, dec: 2 },
    { key: 'Peso total (kg)',    v: week.poids_total,    dec: 0 },
    { key: 'Merma %',            v: week.merma_pct,      dec: 1 },
    { key: 'Cajas previstas',    v: week.cajas,          dec: 0 },
    { key: 'Ratio caj/rac',      v: week.ratio_caj_rac,  dec: 2 },
    { key: 'Edad prom.',         v: week.edad_prom,      dec: 2 },
  ];
  let html = '<div class="card"><div class="card-title">🔮 Previsión semanal</div>';
  html += '<div class="forecast">';
  for (const l of lines) {
    const v = l.v === null || l.v === undefined ? '—' : fmtNum(l.v, l.dec);
    html += '<div class="row"><div class="lbl">' + l.key + '</div><div class="v">' + v + '</div></div>';
  }
  html += '</div></div>';
  return html;
}

function renderCohorts(week) {
  const cohortes = week.cohortes || [];
  let html = '<div class="card"><div class="card-title">🎨 Cohortes por edad</div>';
  html += '<div class="cohorts-table">';

  // Row 1 : âges (+9sem...) — 1ère colonne vide
  html += '<div class="cell lbl"></div>';
  for (const c of cohortes) {
    html += '<div class="cell head-age">+' + c.age_app + 'sem</div>';
  }

  // Row 2 : pastilles couleur — 1ère colonne vide
  html += '<div class="cell lbl"></div>';
  for (const c of cohortes) {
    const col = cintaColor(c.cinta);
    html += '<div class="cell head-pastille">'
         + '<span class="pastille" style="background:' + col + '"></span></div>';
  }

  // Row 3 : nom couleur (Azul, Verde...) — 1ère colonne vide
  html += '<div class="cell lbl"></div>';
  for (const c of cohortes) {
    html += '<div class="cell head-name">' + (c.cinta || '?') + '</div>';
  }

  // Row : Suma T° + flecha de tendencia del ciclo (▲ acorta / ▼ alarga)
  const _pdir = (DATA.panneau && DATA.panneau.direction) || '';
  const _arr = (_pdir === 'RACCOURCISSEMENT') ? ' ▲' : ((_pdir === 'RALLONGEMENT') ? ' ▼' : '');
  html += '<div class="cell lbl">Suma T°</div>';
  for (const c of cohortes) {
    const st = (c.sum_tef !== undefined && c.sum_tef !== null) ? (fmtNum(c.sum_tef) + _arr) : '—';
    html += '<div class="cell"><span class="v" style="opacity:.65">' + st + '</span></div>';
  }

  // Row : Enfundes (floración inicial)
  html += '<div class="cell lbl">Enfundes</div>';
  for (const c of cohortes) {
    html += '<div class="cell"><span class="v" style="opacity:.65">' + fmtNum(c.enfundes) + '</span></div>';
  }

  // Row : Ya cosechado (floración − saldo inicial)
  html += '<div class="cell lbl">Ya cosech.</div>';
  for (const c of cohortes) {
    const dj = (c.deja_recolte !== undefined && c.deja_recolte !== null) ? c.deja_recolte : ((c.enfundes||0) - (c.saldo_ini||0));
    html += '<div class="cell"><span class="v" style="opacity:.65">' + fmtNum(dj) + '</span></div>';
  }

  // Row 4 : Saldo Inicial
  html += '<div class="cell lbl">Saldo ini</div>';
  for (const c of cohortes) {
    const cls = (c.saldo_ini === 0 ? 'v zero' : 'v');
    html += '<div class="cell"><span class="' + cls + '">' + fmtNum(c.saldo_ini) + '</span></div>';
  }

  // Row 5 : Cosecha (avec marqueur visuel selon flags)
  // 🛑 = blocked_now (interdit cette sem)
  // ⚠️ = forced_max_age (soldage d'âge max)
  // ⛔ = forced_block (sem+1 bloquée → solder maintenant)
  html += '<div class="cell lbl">Cosecha</div>';
  for (const c of cohortes) {
    let mark = '';
    if      (c.blocked_now)    mark = ' 🛑';
    else if (c.forced_max_age) mark = ' ⚠️';
    else if (c.forced_block)   mark = ' ⛔';
    const cls = (c.cosecha === 0 ? 'v zero' : 'v');
    html += '<div class="cell"><span class="' + cls + '">'
         + fmtNum(c.cosecha) + mark + '</span></div>';
  }

  // Row 6 : Saldo Final (dernière ligne, pas de border-bottom)
  html += '<div class="cell lbl row-bottom">Saldo fin</div>';
  for (const c of cohortes) {
    const cls = (c.saldo_fin === 0 ? 'v zero' : 'v');
    html += '<div class="cell row-bottom"><span class="' + cls + '">' + fmtNum(c.saldo_fin) + '</span></div>';
  }

  html += '</div></div>';
  return html;
}

function renderKpis(week) {
  const real = week.real || {};
  const useReal = week.is_current && real.tot_cos !== undefined;
  let html = '<div class="kpis">';

  // Card Racimos
  html += '<div class="kpi"><div class="title">Racimos</div>';
  if (useReal) {
    html += '<div class="ln"><span class="k">Real</span><span class="v">' + fmtNum(real.tot_cos) + '</span></div>';
    html += '<div class="ln prev"><span class="k">Prev</span><span class="v">' + fmtNum(week.tot_cos) + '</span></div>';
  } else {
    html += '<div class="ln"><span class="k">Prev</span><span class="v">' + fmtNum(week.tot_cos) + '</span></div>';
  }
  html += '</div>';

  // Card Cajas
  html += '<div class="kpi"><div class="title">Cajas</div>';
  if (useReal) {
    html += '<div class="ln"><span class="k">Real</span><span class="v">' + fmtNum(real.cajas) + '</span></div>';
    html += '<div class="ln prev"><span class="k">Prev</span><span class="v">' + fmtNum(week.cajas) + '</span></div>';
  } else {
    html += '<div class="ln"><span class="k">Prev</span><span class="v">' + fmtNum(week.cajas) + '</span></div>';
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function renderSlide(week) {
  let html = '<div class="slide">';
  html += renderKpis(week);
  if (week.is_current && week.real) {
    html += renderCompare(week);
  } else {
    // Bandeau d'avertissement sur les semaines de prévision futures
    let dateStr = '';
    if (DATA.last_record_date) {
      try {
        const d = new Date(DATA.last_record_date + 'T00:00:00');
        dateStr = d.toLocaleDateString('es-ES', {
          day: '2-digit', month: 'long', year: 'numeric'
        });
      } catch (e) { dateStr = DATA.last_record_date; }
    }
    html += '<div class="warn">';
    html += '<div class="warn-icon">⚠️</div>';
    html += '<div class="warn-text">';
    html += 'Estos datos son una proyección basada en los últimos registros validados. ';
    html += 'Pueden variar significativamente con la realidad.';
    if (dateStr) {
      html += '<div class="warn-date">Último registro: <b>' + dateStr + '</b></div>';
    }
    html += '</div>';
    html += '</div>';
    html += renderForecast(week);
  }
  html += renderCohorts(week);
  html += '</div>';
  return html;
}

function renderAll() {
  // Header sub : phase / slope / corr depuis le bloc DATA courant
  const phase = DATA.phase || '';
  const slope = DATA.slope !== null && DATA.slope !== undefined ? DATA.slope.toFixed(3) : '';
  const ratio_g = DATA.ratio_global !== null && DATA.ratio_global !== undefined
    ? ' · Corr: ' + ((DATA.ratio_global - 1) * 100).toFixed(1) + '%'
    : '';
  const pann = DATA.panneau || {};
  const DIR_ES = {'RALLONGEMENT':'ALARGAMIENTO ▲','RACCOURCISSEMENT':'ACORTAMIENTO ▼','PLATEAU HAUT':'MESETA ALTA','PLATEAU BAS':'MESETA BAJA','TRANSITION':'TRANSICIÓN'};
  let cicloStr = '';
  if (pann.direction) {
    cicloStr = ' · Ciclo: ' + (DIR_ES[pann.direction] || pann.direction);
    if (pann.niveau_dd) cicloStr += ' (' + Math.round(pann.niveau_dd) + ' °C·j/sem)';
  }
  document.getElementById('sub').textContent =
    phase + (slope ? ' (slope=' + slope + ')' : '') + ratio_g + cicloStr;

  // Render slides
  const track = document.getElementById('carousel-track');
  track.innerHTML = WEEKS.map(renderSlide).join('');

  // Dots
  const dots = document.getElementById('dots');
  dots.innerHTML = WEEKS.map((_, i) => '<div class="dot" data-i="' + i + '"></div>').join('');
  dots.querySelectorAll('.dot').forEach(d => {
    d.addEventListener('click', () => goTo(parseInt(d.dataset.i)));
  });

  // Footer (generated_at peut venir du bloc finca ou du wrapper)
  const gen = DATA.generated_at || (DATA_PREV && DATA_PREV.generated_at) || '';
  document.getElementById('gen').textContent = gen;

  // Reset au début à chaque switch de mode
  CURRENT = 0;
  goTo(0);
}

function setMode(m) {
  if (m === MODE) return;
  MODE = m;
  DATA  = (m === 'suivi') ? DATA_SUIVI : DATA_PREV;
  WEEKS = DATA.weeks || [];
  // Toggle visuel des boutons
  document.getElementById('mode-prev').classList.toggle('active',  m === 'prevision');
  document.getElementById('mode-suivi').classList.toggle('active', m === 'suivi');
  renderAll();
}

function init() {
  // Par défaut : mode 'prevision' (vue prospective S0→S+3)
  // DATA / WEEKS sont déjà initialisés sur DATA_PREV plus haut.
  renderAll();
}

function goTo(i) {
  if (i < 0 || i >= WEEKS.length) return;
  CURRENT = i;
  const track = document.getElementById('carousel-track');
  track.style.transform = 'translateX(-' + (i * 100) + '%)';

  const w = WEEKS[i];
  document.getElementById('weekval').textContent =
    'S' + String(w.sem).padStart(2, '0') + '.' + w.yr;
  const badge = document.getElementById('badge');
  if (w.is_current) {
    badge.textContent = 'ACTUAL';
    badge.className = 'badge current';
  } else {
    badge.textContent = '+' + w.delta;
    badge.className = 'badge';
  }

  document.getElementById('prev-btn').disabled = (i === 0);
  document.getElementById('next-btn').disabled = (i === WEEKS.length - 1);

  document.querySelectorAll('.dot').forEach((d, di) => {
    d.classList.toggle('active', di === i);
  });
}

function navWeek(dir) { goTo(CURRENT + dir); }

// Touch swipe
let touchStartX = 0, touchEndX = 0;
document.getElementById('carousel').addEventListener('touchstart', (e) => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });
document.getElementById('carousel').addEventListener('touchend', (e) => {
  touchEndX = e.changedTouches[0].screenX;
  const dx = touchEndX - touchStartX;
  if (Math.abs(dx) > 40) {
    navWeek(dx < 0 ? 1 : -1);
  }
}, { passive: true });

// Keyboard
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') navWeek(-1);
  else if (e.key === 'ArrowRight') navWeek(1);
});

init();
</script>
