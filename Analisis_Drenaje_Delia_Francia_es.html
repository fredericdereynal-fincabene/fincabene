    if(n<=16||k%Math.ceil(n/8)==0)s+=`<text x="${X(k)}" y="${H-8}" font-size="8" text-anchor="middle" fill="#888">${q[0]}</text>`});
  s+='</svg>';
  const vals=p.v.filter(v=>v!=null);
  let h=`<button class="back" onclick="vp=null;render()">← Volver a la lectura</button>
  <div class="card"><div class="ct">${p.p} · Lote ${p.lote||'—'}<span>${p.sec} · fondo ${f2(p.prof)} m</span></div>${s}
  <div style="font-size:10px;color:#888">Arriba = agua cerca de la superficie · barras azules = lluvia 3 días previos</div></div>
  <div class="kpis"><div class="k"><div class="kl">Última</div><div class="kv">${f2(p.v.find(v=>v!=null))}</div></div>
  <div class="k"><div class="kl">Mínimo</div><div class="kv">${vals.length?f2(Math.min(...vals)):'—'}</div></div>
  <div class="k"><div class="kl">&lt; 0.80</div><div class="kv">${vals.filter(v=>v<0.8).length}/${vals.length}</div></div>
  <div class="k"><div class="kl">Lecturas</div><div class="kv">${vals.length}</div></div></div>`;
  return h;}
function bombeoView(){
  let h='';
  for(const e of Object.keys(D.est)){const L=D.est[e];
    if(!L.length){h+=`<div class="card"><div class="ct">${e}</div><div class="empty">Sin registros de bombeo</div></div>`;continue}
    const w=L.slice(0,7),sum=(k)=>w.reduce((a,x)=>a+(x[k]||0),0);
    h+=`<div class="kpis"><div class="k"><div class="kl">Lluvia 7d</div><div class="kv">${Math.round(sum('ll'))}</div></div>
    <div class="k"><div class="kl">Bombeado 7d</div><div class="kv" style="color:#0277BD">${Math.round(sum('mm'))} mm</div></div>
    <div class="k"><div class="kl">Arranques</div><div class="kv">${sum('arr')}</div></div>
    <div class="k"><div class="kl">Fuera consigna</div><div class="kv ${sum('fuera')?'up':''}">${sum('fuera')}</div></div></div>`;
    h+=`<div class="card"><div class="ct">${e}<span>día de hoja 7 h → 7 h</span></div><table class="tbl"><tr><th>Día</th><th>Lluvia</th><th>mm bomb.</th><th>h peq/gra</th><th>Arr.</th><th>Niv. máx</th><th>⚠</th></tr>`;
    for(const x of L){h+=`<tr><td>${x.dow} ${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td><b>${x.mm}</b></td><td>${x.hp}/${x.hg}</td>
      <td class="${x.arr>=5?'warn':''}">${x.arr}</td><td>${x.nmax??'—'}</td><td>${x.al?`<span class="al">${x.al}‼</span> `:''}${x.fuera?`<span class="warn">${x.fuera}</span>`:''}</td></tr>`}
    h+='</table></div>'}
  return h||'<div class="card empty">Sin estaciones</div>';}
function canalChart(c){
  const W=440,H=210,pl=34,pr=16,pt=8,pb=22,X0=0,X1=168;
  const mx=Math.max(c.rep.Alerta_cm*1.05,...c.pts.map(p=>p[1]))*1.02;
  const X=h=>pl+(h-X0)/(X1-X0)*(W-pl-pr),Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  s+=`<rect x="${pl}" y="${Y(c.rep.Objetivo_max_cm)}" width="${W-pl-pr}" height="${Y(c.rep.Objetivo_min_cm)-Y(c.rep.Objetivo_max_cm)}" fill="#4CAF50" opacity=".12"/>`;
  for(const [k,col] of [['Repere_alto_cm','#FFA000'],['Alerta_cm','#D32F2F']]){const v=c.rep[k];
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-dasharray="4 3"/><text x="${W-pr-2}" y="${Y(v)-2}" font-size="8" text-anchor="end" fill="${col}">${v}</text>`}
  [0,100,200,300,400].filter(v=>v<mx).forEach(v=>{s+=`<text x="${pl-4}" y="${Y(v)+3}" font-size="8" text-anchor="end" fill="#999">${v}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/>`});
  const llmax=Math.max(10,...c.ll.map(p=>p[1]));
  c.ll.forEach(p=>{const h=p[1]/llmax*(H-pt-pb)*0.35;s+=`<rect x="${X(p[0])}" y="${pt}" width="${Math.max(1.5,(W-pl-pr)/168)}" height="${h}" fill="#64B5F6"/>`});
  let d='',prev=null;c.pts.forEach(p=>{d+=(prev===null||p[0]-prev>1?'M':'L')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1);prev=p[0]});
  s+=`<path d="${d}" fill="none" stroke="#1F4E79" stroke-width="1.4"/>`;
  const t0=new Date(c.ini);for(let k=0;k<=7;k++){const dd=new Date(t0.getTime()+k*86400000);
    s+=`<line x1="${X(k*24)}" x2="${X(k*24)}" y1="${pt}" y2="${H-pb}" stroke="#f0f0f0"/><text x="${X(k*24)}" y="${H-6}" font-size="8" text-anchor="middle" fill="#888">${String(dd.getDate()).padStart(2,'0')}/${String(dd.getMonth()+1).padStart(2,'0')}</text>`}
  return s+'</svg>';}
function canalView(){
  const C=D.canal||{},ks=Object.keys(C);
  if(!ks.length)return '<div class="card empty">Sin datos de los sensores Solem</div>';
  if(!ce||!C[ce])ce=ks[0];const c=C[ce];
  let h=ks.length>1?'<div class="chips">'+ks.map(k=>`<div class="chip ${k===ce?'on':''}" onclick="ce='${k}';render()">${k}</div>`).join('')+'</div>':'';
  const w=c.dias,sum=k=>w.reduce((a,x)=>a+(x[k]||0),0),rg=w.length?Math.round(w.reduce((a,x)=>a+x.rg,0)/w.length):null;
  h+=`<div class="kpis"><div class="k"><div class="kl">Nivel ahora</div><div class="kv" style="color:#0277BD">${c.ultimo.n}</div><div style="font-size:9px;color:#999">${c.ultimo.t}</div></div>
  <div class="k"><div class="kl">% en rango 7d</div><div class="kv ${rg!==null&&rg<50?'up':''}">${rg??'—'}%</div></div>
  <div class="k"><div class="kl">h > ${c.rep.Repere_alto_cm}</div><div class="kv ${sum('ha')?'up':''}">${sum('ha').toFixed(1)}</div></div>
  <div class="k"><div class="kl">Paradas bajas</div><div class="kv ${sum('pb')?'up':''}">${sum('pb')}</div></div></div>`;
  h+=`<div class="card"><div class="ct">${ce} — 7 días<span>nivel cm · lluvia mm/h</span></div>${canalChart(c)}
  <div class="legc"><span><i style="background:#1F4E79"></i>nivel</span><span><i style="background:#64B5F6;height:6px"></i>lluvia</span><span><i style="background:#4CAF50;height:6px;opacity:.4"></i>rango ${c.rep.Objetivo_min_cm}–${c.rep.Objetivo_max_cm}</span><span><i style="background:#FFA000"></i>repère alto</span><span><i style="background:#D32F2F"></i>alerta</span></div></div>`;
  h+=`<div class="card"><div class="ct">Por día<span>7 h → 7 h</span></div><table class="tbl"><tr><th>Día</th><th>Lluvia</th><th>Máx</th><th>h>alto</th><th>% rango</th><th>Vac.</th><th>Parada</th></tr>`;
  for(const x of w)h+=`<tr><td>${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td class="${x.max>c.rep.Alerta_cm?'warn':''}">${x.max}</td><td class="${x.ha?'warn':''}">${x.ha}</td><td>${x.rg}%</td><td>${x.vid}</td><td class="${x.pb?'warn':''}">${x.par??'—'}${x.pb?' ⚠':''}</td></tr>`;
  h+='</table></div>';
  if(c.eps.length){h+=`<div class="card"><div class="ct">Últimos episodios de lluvia<span>≥ 15 mm</span></div><table class="tbl"><tr><th>Inicio</th><th>mm</th><th>máx 6h</th><th>Nivel máx</th><th>h>alto</th><th>Vuelta</th></tr>`;
    for(const e of c.eps)h+=`<tr><td>${e.f}</td><td>${Math.round(e.mm)}</td><td>${Math.round(e.m6)}</td><td class="${e.max>c.rep.Alerta_cm?'warn':''}">${e.max}</td><td>${e.ha}</td><td>${e.vu==null?'—':e.vu+' h'}</td></tr>`;
    h+='</table></div>'}
  return h;}
function render(){for(const [id,t] of [['t0','canal'],['t1','pozos'],['t2','bombeo']])document.getElementById(id).className='tab'+(tab===t?' on':'');
  document.getElementById('content').innerHTML=tab==='canal'?canalView():(tab==='pozos'?pozosView():bombeoView());window.scrollTo(0,0)}
render();
</script></body></html>
