  let h=`<div class="card"><div class="ct">Últimas 6 lecturas<span>hasta ${S.asof}</span></div>
  <div class="r6 h"><span></span>${S.l6.map(x=>`<span>${x}</span>`).join('')}<span>Días<br>alto</span><span style="text-align:right">Tend.<br>cm/s</span></div>`;
  for(const e of S.est){const g=S.pozos.filter(x=>x.est===e[0]);
    const big=!['rec','ok'].includes(e[0]),open=big||gopen[e[0]];
    h+=`<div class="gh" onclick="gopen['${e[0]}']=!gopen['${e[0]}'];render()"><i style="background:#${e[3]};${e[0]==='ok'||e[0]==='rec'?'border:1px solid #bbb':''}"></i>${e[1]} <b>${g.length}</b><small>${e[2]}</small></div>`;
    if(!g.length)continue;
    const show=open?g:[];
    for(const x of show){
      const cells=x.v6.map(v=>{const c=cx(v,x.prof);return `<div class="c6" style="background:${c[0]};color:${c[1]}">${v==null?'':v.toFixed(2)}</div>`}).join('');
      const ra=x.ra6>0?`<span style="color:#7030A0">${x.ra6}</span>`:x.ra8;
      h+=`<div class="r6" onclick="vp=${x.i};render()"><div class="pz">${x.p.replace('Pozo ','')}<small>${x.lote}</small></div>${cells}
      <div class="rc">${ra}<small>${x.rm8}</small></div><div class="td">${tendTxt(x.tend,T.tend)}</div></div>`}
    if(!open)h+=`<div class="more" onclick="gopen['${e[0]}']=true;render()">ver los ${g.length} pozos ›</div>`}
  h+=`<div class="note"><b>Días alto</b> : arriba = días seguidos en curso bajo ${T.alto.toFixed(2)} m (en violeta si bajo ${T.fuerte.toFixed(2)} m), abajo = racha más larga del mes.
  <b>Tend.</b> : ▲ el agua sube, ▼ baja, = estable (± ${T.tend} cm/sem), sobre las 6 lecturas. Toque un pozo → historial.</div></div>`+legend2();
  return h;}
function mesView(S){
  const T=S.th,W=T.win,lm=Math.max(10,...S.ll.map(v=>v||0));
  const ps=[...S.pozos].sort((a,b)=>b.d80-a.d80||b.rm8-a.rm8||b.d60-a.d60);
  let h=`<div class="card"><div class="ct">Mes deslizante<span>${S.dias[0][0]} → ${S.dias[W-1][0]}</span></div>
  <div class="note" style="margin:0 0 6px">Una fila por pozo, una casilla por día. Los bloques de color seguidos son las rachas. A la derecha : <b>días &lt; ${T.alto.toFixed(2)}</b> / racha más larga.</div>
  <div class="hm"><span style="font-size:9px;color:#888;align-self:end">lluvia<br>máx ${Math.round(lm)}</span>`;
  S.ll.forEach((v,k)=>{h+=`<div class="rb" style="height:${v?Math.max(2,v/lm*36):0}px" title="${S.dias[k][0]} : ${v==null?'—':v+' mm'}"></div>`});
  h+=`<span></span><span style="font-size:8px;color:#C00000">pozos<br>alto</span>`+S.cnt.map(n=>`<div class="cn">${n||''}</div>`).join('')+'<span></span>';
  h+='<span></span>'+S.dias.map(d=>`<div class="tk ${d[2]?'on':''}" title="${d[1]} ${d[0]}${d[2]?' · lectura':''}"></div>`).join('')+'<span></span>';
  h+=`<span></span><span style="grid-column:span ${Math.floor(W/2)};font-size:9px;color:#888">${S.dias[0][0]}</span><span style="grid-column:span ${W-Math.floor(W/2)};font-size:9px;color:#888;text-align:right">${S.dias[W-1][0]}</span><span></span>`;
  for(const x of ps){h+=`<div class="lb" onclick="vp=${x.i};render()">${x.p.replace('Pozo ','')}<small>${x.lote}</small></div>`;
    h+=x.dia.map((v,k)=>{const c=cx(v,x.prof);return `<div class="hc" style="background:${c[0]}" title="${S.dias[k][0]} : ${v==null?'sin dato':v.toFixed(2)+' m'}"></div>`}).join('');
    h+=`<div class="rs"><b>${x.d80}</b>/${x.rm8}${x.d60?`<br><span style="color:#7030A0">${x.d60}&lt;.6</span>`:''}</div>`}
  h+=`</div><div class="note">Números rojos = cuántos pozos estaban bajo ${T.alto.toFixed(2)} m ese día. Trazo negro = día con lectura. Valores entre dos lecturas = interpolados ; gris = sin dato (hueco &gt; ${T.gap} días).</div></div>`+legend2();
  return h;}
function lectView(){
  const L=D.lect[li];
  let h=`<div class="nav"><button class="arrow" ${li>=D.lect.length-1?'disabled':''} onclick="li++;render()">‹</button>
  <div class="big"><div class="lab">Lectura · S${L.sem??''}</div><div class="val">${L.dow} ${L.f}</div></div>
  <button class="arrow" ${li<=0?'disabled':''} onclick="li--;render()">›</button></div>`;
  const pc=col(L.prom), mc=col(L.min);
  h+=`<div class="kpis"><div class="k"><div class="kl">Promedio</div><div class="kv" style="color:${pc[0]}">${f2(L.prom)}</div></div>
  <div class="k"><div class="kl">Mínimo</div><div class="kv" style="color:${mc[0]}">${f2(L.min)}</div></div>
  <div class="k"><div class="kl">&lt; 0.80 m</div><div class="kv ${L.nal?'up':''}">${L.nal??'—'}/${L.n??'—'}</div></div>
  <div class="k"><div class="kl">Lluvia 3d</div><div class="kv">${L.ll3==null?'—':Math.round(L.ll3)}<span style="font-size:10px"> mm</span></div></div></div>`+legend();
  const secs={};D.pozos.forEach((p,i)=>{(secs[p.sec]=secs[p.sec]||[]).push(i)});
  for(const s of Object.keys(secs).sort()){
    h+=`<div class="card"><div class="ct">${s}<span>toque un pozo → historial</span></div>`;
    for(const i of secs[s]){const p=D.pozos[i],x=p.v[li],prev=p.v.slice(li+1).find(v=>v!=null);
      const c=col(x,p.prof),w=x==null?0:Math.min(100,100*x/(p.prof||1.5));
      const dd=(x!=null&&prev!=null)?x-prev:null;
      h+=`<div class="row" onclick="vp=${i};render()"><span>${p.p.replace('Pozo ','')}</span><span style="color:#888">${p.lote||''}</span>
      <div class="bar"><i style="width:${w}%;background:${c[0]}"></i><div class="mk" style="left:${100*0.8/(p.prof||1.5)}%"></div></div>
      <span class="v">${f2(x)}</span><span class="d ${dd==null?'':(dd<-0.004?'up':(dd>0.004?'dn':''))}">${dd==null?'':(dd>0?'+':'')+dd.toFixed(2)}</span></div>`}
    h+='</div>'}
  return h;}
function pozoHist(i){
  const p=D.pozos[i];const pts=[];for(let k=D.lect.length-1;k>=0;k--)pts.push([D.lect[k].f.slice(0,5),p.v[k],D.lect[k].ll3]);
  const W=440,H=200,pl=34,pr=8,pt=10,pb=26,mx=p.prof||1.5,n=pts.length;
  const X=k=>pl+(n<2?0.5:k/(n-1))*(W-pl-pr),Y=v=>pt+(v/mx)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  [[0,0.6,'#7030A0'],[0.6,0.7,'#7B1E1E'],[0.7,0.8,'#FF0000'],[0.8,0.9,'#FFC000'],[0.9,1.0,'#E6D200'],[1.0,mx,'#4CAF50']].forEach(b=>{s+=`<rect x="${pl}" y="${Y(b[0])}" width="${W-pl-pr}" height="${Math.max(0,Y(Math.min(b[1],mx))-Y(b[0]))}" fill="${b[2]}" opacity=".13"/>`});
  [0,0.5,0.8,1.0,mx].forEach(v=>{s+=`<text x="${pl-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#888">${v.toFixed(1)}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ddd"/>`});
  const llmax=Math.max(20,...pts.map(q=>q[2]||0));
  pts.forEach((q,k)=>{if(q[2]){const hh=(q[2]/llmax)*(H-pt-pb)*0.5;s+=`<rect x="${X(k)-3}" y="${H-pb-hh}" width="6" height="${hh}" fill="#90CAF9"/>`}});
  let d='';pts.forEach((q,k)=>{if(q[1]!=null)d+=(d?'L':'M')+X(k)+','+Y(q[1])});
  s+=`<path d="${d}" fill="none" stroke="#1F4E79" stroke-width="2"/>`;
  pts.forEach((q,k)=>{if(q[1]!=null){const c=col(q[1],p.prof);s+=`<circle cx="${X(k)}" cy="${Y(q[1])}" r="3.5" fill="${c[0]}" stroke="#fff"/>`}
    if(n<=16||k%Math.ceil(n/8)==0)s+=`<text x="${X(k)}" y="${H-8}" font-size="8" text-anchor="middle" fill="#888">${q[0]}</text>`});
  s+='</svg>';
  const vals=p.v.filter(v=>v!=null);
  let h=`<button class="back" onclick="vp=null;render()">← Volver</button>
  <div class="card"><div class="ct">${p.p} · Lote ${p.lote||'—'}<span>${p.sec} · fondo ${f2(p.prof)} m</span></div>${s}
  <div style="font-size:10px;color:#888">Arriba = agua cerca de la superficie · barras azules = lluvia 3 días previos</div></div>
  <div class="kpis"><div class="k"><div class="kl">Última</div><div class="kv">${f2(p.v.find(v=>v!=null))}</div></div>
  <div class="k"><div class="kl">Mínimo</div><div class="kv">${vals.length?f2(Math.min(...vals)):'—'}</div></div>
  <div class="k"><div class="kl">&lt; 0.80</div><div class="kv">${vals.filter(v=>v<0.8).length}/${vals.length}</div></div>
  <div class="k"><div class="kl">Lecturas</div><div class="kv">${vals.length}</div></div></div>`;
  return h;}
function bombeoView(){
  let h=`<div class="card" style="font-size:11px;color:#555;line-height:1.5"><b>Qué muestra esta pestaña</b> : lo que el bombero anotó en la <b>Hoja del día</b> (papel), un renglón por día de hoja (de 7 h a 7 h).<br>
  <b>Bombeado</b> = horas de cada bomba × caudal de su velocidad (hoja Parámetros), en mm sobre la superficie drenada y en m³.<br>
  <b>Arranques</b> = veces que se prendió una bomba (muchos arranques = efecto « yoyo »). <b>⚠</b> = líneas fuera de consigna, <b>‼</b> = alerta.</div>`;
  for(const e of Object.keys(D.est)){const L=D.est[e];
    if(!L.length){h+=`<div class="card"><div class="ct">${e}</div><div class="empty">Ninguna Hoja del día guardada</div></div>`;continue}
    const w=L.slice(0,7),sum=(k)=>w.reduce((a,x)=>a+(x[k]||0),0);
    h+=`<div class="card"><div class="ct">${e}<span>${w.length} día${w.length>1?'s':''} con Hoja</span></div>
    <div class="kpis" style="border:none;margin:0;padding:4px 0"><div class="k"><div class="kl">Lluvia</div><div class="kv">${Math.round(sum('ll'))}<span style="font-size:10px"> mm</span></div></div>
    <div class="k"><div class="kl">Bombeado</div><div class="kv" style="color:#0277BD">${Math.round(sum('mm'))}<span style="font-size:10px"> mm</span></div><div style="font-size:9px;color:#999">${Math.round(sum('m3')).toLocaleString('es')} m³</div></div>
    <div class="k"><div class="kl">Arranques</div><div class="kv">${sum('arr')}</div></div>
    <div class="k"><div class="kl">Fuera consigna</div><div class="kv ${sum('fuera')?'up':''}">${sum('fuera')}</div></div></div>
    <table class="tbl"><tr><th>Día de hoja</th><th>Lluvia<br>mm</th><th>Bombeado<br>mm</th><th>Horas<br>peq. / gr.</th><th>Arran-<br>ques</th><th>Nivel<br>máx cm</th><th></th></tr>`;
    for(const x of L){h+=`<tr><td>${x.dow} ${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td><b>${x.mm}</b></td><td>${x.hp} / ${x.hg}</td>
      <td class="${x.arr>=5?'warn':''}">${x.arr}</td><td>${x.nmax??'—'}</td><td>${x.al?`<span class="al">${x.al}‼</span> `:''}${x.fuera?`<span class="warn">${x.fuera}⚠</span>`:''}</td></tr>`}
    h+='</table></div>'}
  return h;}
function canalChart(c){
  const W=440,H=210,pl=34,pr=16,pt=8,pb=22,X0=0,X1=168;
  const mx=Math.max(c.rep.Alerta_cm*1.05,...c.pts.map(p=>p[1]))*1.02;
  const X=h=>pl+(h-X0)/(X1-X0)*(W-pl-pr),Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  s+=`<rect x="${pl}" y="${Y(c.rep.Objetivo_max_cm)}" width="${W-pl-pr}" height="${Y(c.rep.Objetivo_min_cm)-Y(c.rep.Objetivo_max_cm)}" fill="#4CAF50" opacity=".12"/>`;
  for(const [k,col] of [['Repere_alto_cm','#FFA000'],['Alerta_cm','#D32F2F']]){const v=c.rep[k];
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="${col}" stroke-dasharray="4 3"/><text x="${W-pr-2}" y="${Y(v)-2}" font-size="8" text-anchor="end" fill="${col}">${v}</text>`}
  [0,100,200,300,400].filter(v=>v<mx).forEach(v=>{s+=`<text x="${pl-4}" y="${Y(v)+3}" font-size="8" text-anchor="end" fill="#999">${v}</text><line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eee"/>`});
  const llmax=Math.max(10,...c.ll.map(p=>p[1]));
  c.ll.forEach(p=>{const h=p[1]/llmax*(H-pt-pb)*0.35;s+=`<rect x="${X(p[0])}" y="${pt}" width="${Math.max(1.5,(W-pl-pr)/168)}" height="${h}" fill="#64B5F6"/>`});
  let d='',prev=null;c.pts.forEach(p=>{d+=(prev===null||p[0]-prev>1?'M':'L')+X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1);prev=p[0]});
  s+=`<path d="${d}" fill="none" stroke="#1F4E79" stroke-width="1.4"/>`;
  const t0=new Date(c.ini);for(let k=0;k<=7;k++){const dd=new Date(t0.getTime()+k*86400000);
    s+=`<line x1="${X(k*24)}" x2="${X(k*24)}" y1="${pt}" y2="${H-pb}" stroke="#f0f0f0"/><text x="${X(k*24)}" y="${H-6}" font-size="8" text-anchor="middle" fill="#888">${String(dd.getDate()).padStart(2,'0')}/${String(dd.getMonth()+1).padStart(2,'0')}</text>`}
  return s+'</svg>';}
function canalView(){
  const C=D.canal||{},ks=Object.keys(C);
  if(!ks.length)return '<div class="card empty">Sin datos de los sensores Solem</div>';
  if(!ce||!C[ce])ce=ks[0];const c=C[ce];
  let h=ks.length>1?'<div class="chips">'+ks.map(k=>`<div class="chip ${k===ce?'on':''}" onclick="ce='${k}';render()">${k}</div>`).join('')+'</div>':'';
  const w=c.dias,sum=k=>w.reduce((a,x)=>a+(x[k]||0),0),rg=w.length?Math.round(w.reduce((a,x)=>a+x.rg,0)/w.length):null;
  h+=`<div class="kpis"><div class="k"><div class="kl">Nivel ahora</div><div class="kv" style="color:#0277BD">${c.ultimo.n}</div><div style="font-size:9px;color:#999">${c.ultimo.t}</div></div>
  <div class="k"><div class="kl">% en rango 7d</div><div class="kv ${rg!==null&&rg<50?'up':''}">${rg??'—'}%</div></div>
  <div class="k"><div class="kl">h > ${c.rep.Repere_alto_cm}</div><div class="kv ${sum('ha')?'up':''}">${sum('ha').toFixed(1)}</div></div>
  <div class="k"><div class="kl">Paradas bajas</div><div class="kv ${sum('pb')?'up':''}">${sum('pb')}</div></div></div>`;
  h+=`<div class="card"><div class="ct">${ce} — 7 días<span>nivel cm · lluvia mm/h</span></div>${canalChart(c)}
  <div class="legc"><span><i style="background:#1F4E79"></i>nivel</span><span><i style="background:#64B5F6;height:6px"></i>lluvia</span><span><i style="background:#4CAF50;height:6px;opacity:.4"></i>rango ${c.rep.Objetivo_min_cm}–${c.rep.Objetivo_max_cm}</span><span><i style="background:#FFA000"></i>repère alto</span><span><i style="background:#D32F2F"></i>alerta</span></div></div>`;
  h+=`<div class="card"><div class="ct">Por día<span>7 h → 7 h</span></div><table class="tbl"><tr><th>Día</th><th>Lluvia</th><th>Máx</th><th>h>alto</th><th>% rango</th><th>Vac.</th><th>Parada</th></tr>`;
  for(const x of w)h+=`<tr><td>${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td class="${x.max>c.rep.Alerta_cm?'warn':''}">${x.max}</td><td class="${x.ha?'warn':''}">${x.ha}</td><td>${x.rg}%</td><td>${x.vid}</td><td class="${x.pb?'warn':''}">${x.par??'—'}${x.pb?' ⚠':''}</td></tr>`;
  h+='</table></div>';
  if(c.eps.length){h+=`<div class="card"><div class="ct">Últimos episodios de lluvia<span>≥ 15 mm</span></div><table class="tbl"><tr><th>Inicio</th><th>mm</th><th>máx 6h</th><th>Nivel máx</th><th>h>alto</th><th>Vuelta</th></tr>`;
    for(const e of c.eps)h+=`<tr><td>${e.f}</td><td>${Math.round(e.mm)}</td><td>${Math.round(e.m6)}</td><td class="${e.max>c.rep.Alerta_cm?'warn':''}">${e.max}</td><td>${e.ha}</td><td>${e.vu==null?'—':e.vu+' h'}</td></tr>`;
    h+='</table></div>'}
  return h;}
function render(){for(const [id,t] of [['t0','canal'],['t1','pozos'],['t2','bombeo']])document.getElementById(id).className='tab'+(tab===t?' on':'');
  document.getElementById('content').innerHTML=tab==='canal'?canalView():(tab==='pozos'?pozosView():bombeoView());
  document.getElementById('foot').textContent='Generado 30/10/2026 10:16 · '+({canal:'nivel del canal medido por los sensores Solem (cm)',pozos:'pozos : profundidad del agua en m (más grande = mejor)',bombeo:'bombeo : según la Hoja del día del bombero'})[tab];
  window.scrollTo(0,0)}
render();
</script></body></html>
