    h+='</div>'}
  return h;}
function render(){for(const [id,t] of [['t0','canal'],['t1','pozos'],['t2','bombeo'],['t3','motores']])document.getElementById(id).className='tab'+(tab===t?' on':'');
  document.getElementById('content').innerHTML=tab==='canal'?canalView():(tab==='pozos'?pozosView():(tab==='motores'?motoresView():bombeoView()));
  document.getElementById('foot').textContent='Generado 20/11/2026 18:13 · '+({canal:'nivel del canal medido por los sensores Solem (cm)',pozos:'pozos : profundidad del agua en m (más grande = mejor)',bombeo:'bombeo : según la Hoja del día del bombero',motores:'motores : horómetros + Hoja del día · diésel calculado'})[tab];
  window.scrollTo(0,0)}
render();
</script></body></html>
