    if(n<=16||k%Math.ceil(n/8)==0)s+=`<text x="${X(k)}" y="${H-8}" font-size="8" text-anchor="middle" fill="#888">${q[0]}</text>`});

  <div class="card"><div class="ct">${p.p} · Lote ${p.lote||'—'}<span>${p.sec} · fondo ${f2(p.prof)} m</span></div>${s}
  <div style="font-size:10px;color:#888">Arriba = agua cerca de la superficie · barras azules = lluvia de los 3 días previos (mm, escala a la derecha)</div></div>
  <div class="kpis"><div class="k"><div class="kl">Última</div><div class="kv">${f2(p.v.find(v=>v!=null))}</div></div>

function bombeoView(){
  let h=`<div class="card" style="font-size:11px;color:#555;line-height:1.5"><b>Qué muestra esta pestaña</b> : lo que el bombero anotó en la <b>Hoja del día</b> (papel), un renglón por día de hoja (de 7 h a 7 h). Los días <b>sin Hoja</b> guardada aparecen en gris.<br>
  <b>Bombeado</b> = horas de cada bomba × caudal de su régimen (hoja Parámetros), en mm sobre la superficie drenada y en m³.<br>
  <b>Arranques</b> = veces que se prendió una bomba (muchos arranques = efecto « yoyo »). <b>⚠</b> = líneas fuera de consigna, <b>‼</b> = alerta.<br>
  <b>Nivel máx</b> : <b>Hoja</b> = anotado por el bombero, <b>sensor</b> = medido. Colores = zonas de la consigna.</div>`;
  for(const e of Object.keys(D.est)){const E=D.est[e],L=E.dias,z=E.zon;
    if(!L.length){h+=`<div class="card"><div class="ct">${e}</div><div class="empty">Ninguna Hoja del día guardada</div></div>`;continue}
    const w=L.filter(x=>x.n7),wh=w.filter(x=>!x.sin),sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0),fal=w.length-wh.length;
    h+=`<div class="card"><div class="ct">${e}<span>últimos 7 días : <b style="color:${fal?'#C00000':'#2E7D32'}">${wh.length} Hoja${wh.length>1?'s':''} de 7</b></span></div>
    <div class="kpis" style="border:none;margin:0;padding:4px 0"><div class="k"><div class="kl">Lluvia 7 d</div><div class="kv">${Math.round(sum(w,'ll'))}<span style="font-size:10px"> mm</span></div></div>
    <div class="k"><div class="kl">Bombeado</div><div class="kv" style="color:#0277BD">${Math.round(sum(wh,'mm'))}<span style="font-size:10px"> mm</span></div><div style="font-size:9px;color:#999">${Math.round(sum(wh,'m3')).toLocaleString('es')} m³${fal?' · '+wh.length+' Hojas':''}</div></div>
    <div class="k"><div class="kl">Arranques</div><div class="kv">${sum(wh,'arr')}</div></div>
    <div class="k"><div class="kl">Fuera consigna</div><div class="kv ${sum(wh,'fuera')?'up':''}">${sum(wh,'fuera')}</div></div></div>
    ${(E.av||[]).length?`<div style="background:#FDECEA;color:#7B1E1E;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:600;margin:4px 0 8px;line-height:1.5">${E.av.join('<br>')}<br><span style="font-weight:400;color:#888">Anotado en Observación · las líneas siguen controladas con la consigna normal.</span></div>`:''}
    <table class="tbl" style="font-size:11.5px"><tr><th>Día de hoja</th><th>Lluvia<br>mm</th><th>Bombeado<br>mm</th><th>Horas<br>peq. / gr.</th><th>Arran-<br>ques</th><th>Nivel máx<br>Hoja</th><th>Nivel máx<br>sensor</th><th></th></tr>`;
    for(const x of L){
      if(x.sin){h+=`<tr class="sin"><td>${x.dow} ${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td class="lab" colspan="4">sin Hoja</td><td class="${zc(x.ns,z)}">${x.ns??'—'}</td><td></td></tr>`;continue}
      h+=`<tr><td>${x.dow} ${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td><b>${x.mm}</b></td><td style="white-space:nowrap">${x.hp}/${x.hg}</td>
      <td class="${x.arr>=5?'warn':''}">${x.arr}</td><td class="${zc(x.nmax,z)}">${x.nmax??'—'}</td><td class="${zc(x.ns,z)}">${x.ns??'—'}</td><td>${x.al?`<span class="al">${x.al}‼</span> `:''}${x.fuera?`<span class="warn">${x.fuera}⚠</span>`:''}</td></tr>`;
      if(x.inc||x.horo)h+=`<tr class="nota"><td colspan="8">${x.inc?'⚠ '+x.inc:''}${x.inc&&x.horo?'<br>':''}${x.horo?'⏱ '+x.horo:''}</td></tr>`}
    h+='</table></div>'}
  return h;}
function zc(n,z){if(n==null||!z)return '';const pp=z.Peq_parada_cm,pa=z.Peq_arranque_seco_cm,al=z.Alerta_lluvia_cm;return (n<pp||n>=al)?'zr':(n>pa?'zo':'zv')}
function canalWin(c){const HW=c.hw||48,fin=c.fin??(c.pts.length?c.pts[c.pts.length-1][0]:HW);
  let w0=cw===null?fin-HW:cw;return Math.max(0,Math.min(w0,fin-HW));}
function canalPts(c,w0,HW){const r=[];let prevP=null;for(const p of c.pts){if(p[0]<w0){prevP=p;continue}if(p[0]>w0+HW)break;r.push(p)}
  if(prevP&&r.length&&r[0][0]-prevP[0]<=7)r.unshift(prevP);return r;}
function canalChart(c){
  const HW=c.hw||48,W=440,H=230,pl=34,pr=16,pt=8,pb=30,w0=canalWin(c),X0=w0,X1=w0+HW,R=c.rep,P=canalPts(c,w0,HW);
  const mx=Math.max(R.Alerta_lluvia_cm*1.12,...P.map(p=>p[1]))*1.02;
  const X=h=>pl+(h-X0)/(X1-X0)*(W-pl-pr),Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  // zonas : rojo bajo la parada, verde hasta el arranque sin lluvia, naranja hasta la alerta con lluvia, rojo encima
  for(const [a,b,col,op] of [[0,R.Peq_parada_cm,'#FF0000',.16],[R.Peq_parada_cm,R.Peq_arranque_seco_cm,'#4CAF50',.18],
      [R.Peq_arranque_seco_cm,R.Alerta_lluvia_cm,'#FFC000',.22],[R.Alerta_lluvia_cm,mx,'#FF0000',.16]])
    s+=`<rect x="${pl}" y="${Y(Math.min(b,mx))}" width="${W-pl-pr}" height="${Math.max(0,Y(a)-Y(Math.min(b,mx)))}" fill="${col}" opacity="${op}"/>`;
  const tk=mx<250?[0,50,100,150,200]:[0,100,200,300,400,500];
  tk.filter(v=>v<mx).forEach(v=>{s+=`<text x="${pl-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#999">${v}</text>`});
  // ejes de tiempo : cada 6 h, fecha a medianoche
  const t0=new Date(new Date(c.ini).getTime()+w0*3600000),hh0=t0.getHours()+t0.getMinutes()/60;
  for(let h=w0+(6-hh0%6)%6;h<=X1+0.01;h+=6){const dd=new Date(new Date(c.ini).getTime()+h*3600000),hr=dd.getHours(),noche=hr===0;
    s+=`<line x1="${X(h)}" x2="${X(h)}" y1="${pt}" y2="${H-pb}" stroke="${noche?'#90A4AE':'#ffffff'}" stroke-opacity="${noche?.7:.8}"/>`;
    s+=`<text x="${X(h)}" y="${H-pb+11}" font-size="9" text-anchor="middle" fill="#888">${String(hr).padStart(2,'0')}h</text>`;
    if(noche)s+=`<text x="${X(h)}" y="${H-pb+23}" font-size="9" font-weight="600" text-anchor="middle" fill="#555">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][dd.getDay()]} ${String(dd.getDate()).padStart(2,'0')}/${String(dd.getMonth()+1).padStart(2,'0')}</text>`}
  const LL=c.ll.filter(p=>p[0]>=X0&&p[0]<X1),llmax=Math.max(10,...LL.map(p=>p[1])),bw=(W-pl-pr)/HW;
  LL.forEach(p=>{const h=p[1]/llmax*(H-pt-pb)*0.35;
    s+=`<rect x="${X(p[0])+0.5}" y="${pt}" width="${Math.max(1.5,bw-1)}" height="${h}" fill="#1E88E5" opacity=".75"><title>${p[1]} mm</title></rect>`;
    if(bw>6&&p[1]>=5)s+=`<text x="${X(p[0])+bw/2}" y="${pt+h+9}" font-size="8" text-anchor="middle" fill="#0D47A1">${Math.round(p[1])}</text>`});
  // cotas : alerta sin lluvia (trazo) y bordes de las zonas
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(R.Alerta_seco_cm)}" y2="${Y(R.Alerta_seco_cm)}" stroke="#C62828" stroke-dasharray="5 3" stroke-width="1.2"/>`;
  s+=`<text x="${W-pr-2}" y="${Y(R.Alerta_seco_cm)-3}" font-size="8.5" text-anchor="end" fill="#C62828">alerta sin lluvia ${R.Alerta_seco_cm}</text>`;
  for(const [v,col] of [[R.Alerta_lluvia_cm,'#B71C1C'],[R.Peq_arranque_seco_cm,'#8D6E00'],[R.Peq_parada_cm,'#1E5631']])
    if(v<mx)s+=`<text x="${pl+3}" y="${Y(v)-3}" font-size="8.5" fill="${col}">${v}</text>`;
  // nivel : cada medida del sensor (sin promedio) ; hueco > 7 h = sensor mudo
  let d='',prev=null;P.forEach(p=>{const x=Math.max(X(p[0]),pl);d+=(prev===null||p[0]-prev>7?'M':'L')+x.toFixed(1)+','+Y(p[1]).toFixed(1);prev=p[0]});
  s+=`<path d="${d}" fill="none" stroke="#0B2E4F" stroke-width="1.6" stroke-linejoin="round"/>`;
  const u=P[P.length-1];if(u&&cw===null)s+=`<circle cx="${X(u[0])}" cy="${Y(u[1])}" r="3.5" fill="#0B2E4F"/>`;
  return s+'</svg>';}
function cwVer(hh){cw=Math.round(hh);render();const e=document.getElementById('cchart');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}
function cwMove(dh){const c=(D.canal||{})[ce];cw=canalWin(c)+dh;if(cw>=c.fin-(c.hw||48))cw=null;render();}
function cwDia(v){const c=(D.canal||{})[ce];if(!v)return;const t=new Date(v+'T07:00'),hh=(t-new Date(c.ini))/3600000;cwVer(hh-6);}
function canalView(){
  const C=D.canal||{},ks=Object.keys(C);
  if(!ks.length)return '<div class="card empty">Sin datos de los sensores Solem</div>';
  if(!ce||!C[ce])ce=ks[0];const c=C[ce];
  let h=ks.length>1?'<div class="chips">'+ks.map(k=>`<div class="chip ${k===ce?'on':''}" onclick="ce='${k}';cw=null;render()">${k}</div>`).join('')+'</div>':'';
  const w=c.dias,R=c.rep,sum=k=>w.reduce((a,x)=>a+(x[k]||0),0),rg=w.length?Math.round(w.reduce((a,x)=>a+x.rg,0)/w.length):null;
  h+=`<div class="kpis"><div class="k"><div class="kl">Nivel ahora</div><div class="kv ${zc(c.ultimo.n,R)}" style="border-radius:6px">${c.ultimo.n}</div><div style="font-size:9px;color:#999">${c.ultimo.t}</div></div>
  <div class="k"><div class="kl">% zona verde 7d</div><div class="kv ${rg!==null&&rg<50?'up':''}">${rg??'—'}%</div></div>
  <div class="k"><div class="kl">h > ${R.Peq_arranque_seco_cm} (7d)</div><div class="kv ${sum('ha')?'up':''}">${sum('ha').toFixed(1)}</div></div>
  <div class="k"><div class="kl">Paradas &lt; ${R.Peq_parada_cm}</div><div class="kv ${sum('pb')?'up':''}">${sum('pb')}</div></div></div>`;
  const HW=c.hw||48,w0=canalWin(c),P=canalPts(c,w0,HW),wmax=P.length?Math.max(...P.map(p=>p[1])):null,
        wll=c.ll.filter(p=>p[0]>=w0&&p[0]<w0+HW).reduce((a,p)=>a+p[1],0),fd=hh=>{const d=new Date(new Date(c.ini).getTime()+hh*3600000);
        return ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+'h'},
        iso=hh=>{const d=new Date(new Date(c.ini).getTime()+hh*3600000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
  h+=`<div class="card" id="cchart"><div class="ct">${ce} — ${cw===null?'últimas '+HW+' h':fd(w0)+' → '+fd(w0+HW)}<span>nivel cm · lluvia mm/h</span></div>
  <div class="cnav"><button onclick="cwMove(-12)" ${w0<=0?'disabled':''}>‹ 12 h</button>
  <input type="date" value="${iso(w0+6)}" min="${iso(0)}" max="${iso(c.fin)}" onchange="cwDia(this.value)">
  <button onclick="cwMove(12)" ${cw===null?'disabled':''}>12 h ›</button><button class="${cw===null?'on':''}" onclick="cw=null;render()">Ahora</button></div>
  <div style="font-size:11px;color:#555;margin:2px 0 4px">en esta ventana : máx <b>${wmax??'—'}</b> cm · lluvia <b>${Math.round(wll)}</b> mm${cw===null?'':' · <span style="color:#888">tocar un día o un episodio abajo para verlo</span>'}</div>${canalChart(c)}
  <div class="legc"><span><i style="background:#0B2E4F"></i>nivel (cada medida)</span><span><i style="background:#1E88E5;height:6px"></i>lluvia</span>
  <span><i style="background:#4CAF50;height:7px;opacity:.5"></i>verde ${R.Peq_parada_cm}–${R.Peq_arranque_seco_cm}</span><span><i style="background:#FFC000;height:7px;opacity:.6"></i>naranja ${R.Peq_arranque_seco_cm}–${R.Alerta_lluvia_cm}</span>
  <span><i style="background:#FF0000;height:7px;opacity:.4"></i>rojo &lt;${R.Peq_parada_cm} y ≥${R.Alerta_lluvia_cm}</span><span><i style="background:#C62828"></i>alerta sin lluvia ${R.Alerta_seco_cm}</span></div></div>`;
  h+=`<div class="card"><div class="ct">Por día<span>7 h → 7 h</span></div><table class="tbl"><tr><th>Día ▸</th><th>Lluvia</th><th>Máx</th><th>h > ${R.Peq_arranque_seco_cm}</th><th>% verde</th><th>Vac.</th><th>Parada</th></tr>`;
  for(const x of w)h+=`<tr class="clk" onclick="cwVer(${x.h}-6)"><td>${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td class="${zc(x.max,R)}">${x.max}</td><td class="${x.ha?'warn':''}">${x.ha}</td><td>${x.rg}%</td><td>${x.vid}</td><td class="${x.pb?'warn':''}">${x.par??'—'}${x.pb?' ⚠':''}</td></tr>`;
  h+='</table></div>';
  if(c.eps.length){h+=`<div class="card"><div class="ct">Últimos episodios de lluvia<span>≥ 15 mm</span></div><table class="tbl" style="font-size:11px"><tr><th>Inicio</th><th>Fin lluvia</th><th>mm</th><th>Nivel máx</th><th>h > ${R.Peq_arranque_seco_cm}<br><span style="font-weight:400">desde inicio lluvia</span></th><th>Vuelta &lt; ${R.Peq_arranque_seco_cm}<br><span style="font-weight:400">tras fin lluvia</span></th></tr>`;
    const EP=epAll?c.eps:c.eps.slice(0,5);

    h+=`</table>${c.eps.length>5?`<div class="more" style="padding-left:0;margin-top:6px" onclick="epAll=!epAll;render()">${epAll?'ver menos':'ver los '+c.eps.length+' episodios ('+Math.round(c.fin/24)+' días) ›'}</div>`:''}
    <div style="font-size:10px;color:#888;margin-top:6px">tocar un episodio : gráfico de 48 h desde 6 h antes del inicio de la lluvia · máx en 6 h y detalle completo : Excel, hoja 🌧️ Episodios.</div></div>`}
  return h;}
function motoresView(){const M=D.mot;if(!M)return '<div class="card empty">Sin datos de motores</div>';
  let h='';
  if(!M.existe)h+='<div class="pend">Completar la saisie Motores (Parámetros, Mantenimiento, Diésel) y GUARDAR.</div>';
  h+='<div class="card"><div class="ct">Alertas<span>umbrales : hoja Parámetros de la saisie Motores</span></div>'+
     (M.al.length?M.al.map(a=>`<div class="malert z-${a.nivel}">${a.txt}</div>`).join(''):'<div style="color:#2E7D32;font-weight:600">✓ Ninguna alerta</div>')+'</div>';
  for(const d of M.die){
    h+=`<div class="card"><div class="ct">⛽ ${d.est}<span>${d.cap?'cubas '+d.cap.toLocaleString('de-DE',{maximumFractionDigits:0})+' L':'capacidad no definida'}</span></div>`;
    if(d.stock==null){h+=`<div class="malert z-${d.e}">${d.t}</div></div>`;continue}
    const mx=Math.max(d.cap||0,d.calc,d.res||0,d.resn||0,1),pc=v=>Math.max(0,Math.min(100,100*v/mx));

      ${d.res?`<div style="position:absolute;top:0;bottom:0;left:${pc(d.res)}%;width:2px;background:#C00000"></div>`:''}
      ${d.resn?`<div style="position:absolute;top:0;bottom:0;left:${pc(d.resn)}%;width:2px;background:#E69500"></div>`:''}</div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:#888"><span>0</span><span><b style="color:#C00000">▮</b> roja ${d.hr} h · <b style="color:#E69500">▮</b> naranja ${d.hn} h</span><span>${mx.toLocaleString('de-DE',{maximumFractionDigits:0})} L</span></div>
      <div class="kpis" style="border:none;margin:6px 0 0;padding:0"><div class="k"><div class="kl">Stock prudente</div><div class="kv">${d.stock.toLocaleString('de-DE',{maximumFractionDigits:0})}<span style="font-size:10px"> L</span></div></div>
      <div class="k"><div class="kl">Quedan a pleno consumo</div><div class="kv ${d.e==='rojo'?'up':''}">${d.horas!=null?Math.max(d.horas,0)+'<span style="font-size:10px"> h</span>':'—'}</div><div style="font-size:10px;color:#888">${d.dias!=null?Math.max(d.dias,0)+' días':''}</div></div>
      <div class="k"><div class="kl">Pedir</div><div class="kv" style="font-size:15px">${d.pedir!=null?d.pedir.toLocaleString('de-DE',{maximumFractionDigits:0})+' L':'—'}</div></div></div>
      <div class="malert z-${d.e}">${d.t}</div>
      <div class="note">Calculado hasta la última línea de Hoja (${d.fin}) : ${d.calc.toLocaleString('de-DE',{maximumFractionDigits:0})} L ; desde entonces ${d.hsin} h contadas a pleno consumo (${d.plena} L/h).${d.ult?' Última recarga '+d.ult+'.':''}${d.aviso?'<br><b style="color:#C00000">⚠ '+d.aviso+'</b>':''}</div></div>`}
  for(const est of [...new Set(M.mot.map(m=>m.est))]){

      h+=`<div style="margin-top:8px;font-weight:700;font-size:13px">${m.b} <span style="font-weight:400;color:#888;font-size:11px">${m.motor}</span>

        m.ops.map(o=>`<div class="mz z-${o.e}">${o.op}<small>${o.t}${o.f?' · ≈'+o.f:''}</small>${o.iv?`<small style="opacity:.7">cada ${o.iv} h · alerta ${o.al} h</small>`:''}</div>`).join('')+'</div>'}
    h+='</div>'}
  return h;}
function render(){for(const [id,t] of [['t0','canal'],['t1','pozos'],['t2','bombeo'],['t3','motores']])document.getElementById(id).className='tab'+(tab===t?' on':'');

  document.getElementById('foot').textContent='Generado 19/11/2026 09:57 · '+({canal:'nivel del canal medido por los sensores Solem (cm)',pozos:'pozos : profundidad del agua en m (más grande = mejor)',bombeo:'bombeo : según la Hoja del día del bombero',motores:'motores : horómetros + Hoja del día · diésel calculado'})[tab];
  window.scrollTo(0,0)}
