<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7f5;color:#1a1a1a}
#wrap{max-width:480px;margin:0 auto;padding:14px}

.cnav{display:flex;gap:6px;align-items:center;margin:4px 0}.cnav button{padding:6px 8px;border-radius:14px;border:1.5px solid #ccc;background:#fff;font-size:12px;cursor:pointer;white-space:nowrap}

tr.clk{cursor:pointer}tr.clk:active td{background:#E3F2FD}
.legc{display:flex;flex-wrap:wrap;gap:8px;font-size:9px;color:#666;margin-top:4px}.legc i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:3px}
.tab{flex:1;text-align:center;padding:8px 1px;border-radius:10px;border:2px solid #0277BD;color:#0277BD;font-weight:600;font-size:11px;background:#fff;cursor:pointer;white-space:nowrap;letter-spacing:-.2px}
.mz{border-radius:6px;padding:4px 6px;font-size:10.5px;font-weight:600;line-height:1.25;text-align:center}.mz small{display:block;font-weight:400;font-size:9.5px;opacity:.85}
.z-rojo{background:#FF0000;color:#fff}.z-naranja{background:#FFC000;color:#000}.z-verde{background:#C6EFCE;color:#1E5631}.z-gris{background:#EEEEEE;color:#757575}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:6px}.malert{border-radius:8px;padding:6px 8px;margin:4px 0;font-size:12px;font-weight:600}
.tab.on{background:#0277BD;color:#fff}
.nav{display:flex;gap:6px;margin-bottom:12px}
.arrow{background:#fff;border:2px solid #0277BD;color:#0277BD;border-radius:8px;padding:0 12px;font-size:18px;font-weight:bold;cursor:pointer}

.big{flex:1;background:#fff;border:2px solid #0277BD;border-radius:8px;padding:4px 12px;text-align:center}
.big .lab{font-size:10px;color:#888;text-transform:uppercase}.big .val{font-size:19px;font-weight:600;color:#0277BD}
.kpis{background:#fff;border:1px solid #e5e8e5;border-radius:12px;padding:10px;margin-bottom:10px;display:grid;grid-template-columns:repeat(4,1fr)}
.k{text-align:center}.k+.k{border-left:1px solid #eee}.kl{font-size:9px;color:#888;text-transform:uppercase}.kv{font-size:16px;font-weight:600;margin-top:2px}
.card{background:#fff;border:1px solid #e5e8e5;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.ct{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}.ct span{font-size:10px;color:#888;font-weight:400}
.row{display:grid;grid-template-columns:66px 38px 1fr 44px 36px;gap:6px;align-items:center;padding:4px 0;font-size:12px;cursor:pointer}
.bar{height:12px;background:#eef1ee;border-radius:6px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.mk{position:absolute;top:-2px;bottom:-2px;width:1px;background:#555}
.v{text-align:right;font-weight:600}.d{text-align:right;font-size:10px}
.up{color:#C62828}.dn{color:#2B8A3E}
.leg{display:flex;flex-wrap:wrap;gap:4px;font-size:9px;margin-bottom:10px}.leg b{padding:2px 6px;border-radius:6px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:11px}.tbl th{font-size:9px;color:#666;font-weight:500;text-align:right;padding:3px 2px;border-bottom:1px solid #eee}
.tbl td{text-align:right;padding:4px 2px;border-bottom:1px solid #f3f3f3}.tbl td:first-child,.tbl th:first-child{text-align:left}
.warn{color:#BF360C;font-weight:600}.al{background:#FF0000;color:#fff;border-radius:4px;padding:0 4px;font-weight:600}
.back{width:100%;background:#fff;color:#0277BD;border:2px solid #0277BD;border-radius:10px;padding:9px;font-weight:600;margin-bottom:10px}
.empty{color:#999;font-style:italic;font-size:12px;padding:10px 0;text-align:center}
.foot{text-align:center;font-size:10px;color:#aaa;margin:16px 0 8px}
.zv{background:#C6EFCE!important;color:#1E5631!important;font-weight:700}.zo{background:#FFC000!important;color:#000!important;font-weight:700}.zr{background:#FF0000!important;color:#fff!important;font-weight:700}
.sin td{color:#aaa;background:#fafafa}.sin td.lab{color:#C00000;font-style:italic}
.tbl td:first-child{white-space:nowrap}
.tbl tr.nota td{white-space:normal;background:#FFF3E0;color:#BF360C;font-size:10.5px;font-weight:600;text-align:left;padding:3px 6px;line-height:1.35}
.pend{background:#FCE4D6;color:#C00000;border-radius:10px;padding:8px 10px;font-size:12px;font-weight:600;margin-bottom:10px}
.gh{display:flex;align-items:center;gap:6px;margin:12px 0 4px;font-size:13px;font-weight:600;cursor:pointer}.gh i{width:12px;height:12px;border-radius:50%;flex:none}
.gh small{font-weight:400;color:#888;font-size:10.5px;margin-left:auto;text-align:right}
.r6{display:grid;grid-template-columns:44px repeat(6,1fr) 30px 40px;gap:2px;align-items:center;margin:2px 0;cursor:pointer}
.r6.h{cursor:default;font-size:9px;color:#888;text-align:center;line-height:1.15}
.pz{font-size:12px;font-weight:600;line-height:1.1}.pz small{display:block;font-weight:400;color:#888;font-size:10px}
.c6{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.rc{text-align:center;font-weight:700;font-size:13px;line-height:1.05}.rc small{display:block;font-weight:400;color:#888;font-size:9.5px}
.td{text-align:right;font-size:12px}.more{font-size:11px;color:#0277BD;padding:2px 0 4px 46px;cursor:pointer}
.hm{display:grid;grid-template-columns:42px repeat(30,1fr) 34px;column-gap:1px;row-gap:2px;align-items:center}
.hm .hc{height:12px;border-radius:2px}.hm .lb{font-size:10px;font-weight:600;line-height:1}.hm .lb small{display:block;font-weight:400;color:#888;font-size:8.5px}
.hm .rs{font-size:10px;color:#888;text-align:right}.hm .rs b{color:#1a1a1a}
.hm .rb{align-self:end;background:#5B8FB9;border-radius:2px 2px 0 0}.hm .cn{font-size:8px;color:#C00000;font-weight:700;text-align:center;height:10px}
.hm .tk{height:4px;border-radius:2px}.hm .tk.on{background:#333}
.note{font-size:10.5px;color:#888;margin-top:6px;line-height:1.4}
</style><style>
.tz-card{background:#fff;border:1px solid #e5e8e5;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.tz-ct{font-size:13px;font-weight:700;margin-bottom:6px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.tz-ct span{font-size:10px;font-weight:400;color:#888;text-align:right}
.tz-b{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.tz-verde{background:#C6EFCE;color:#1B5E20}.tz-amarillo{background:#FFF59D;color:#6D5B00}.tz-naranja{background:#FFD180;color:#8A4B00}
.tz-rojo{background:#FF8A80;color:#7F0000}.tz-gris{background:#E0E0E0;color:#555}
.tz-sub{font-size:11px;color:#666;margin:2px 0 4px}
.tz-sq{display:flex;gap:2px;margin:4px 0}.tz-sq i{flex:1;height:9px;border-radius:2px}
.tz-tbl{width:100%;border-collapse:collapse;font-size:11px}.tz-tbl th{color:#666;font-weight:600;text-align:center;padding:3px 2px;border-bottom:1px solid #eee;font-size:10px}
.tz-tbl td{text-align:center;padding:4px 2px;border-bottom:1px solid #f3f3f3}.tz-tbl td:first-child{text-align:left}
.tz-leg{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:10px;color:#666;margin-top:4px}.tz-leg i{display:inline-block;width:12px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.tz-note{font-size:10px;color:#888;margin-top:6px;line-height:1.4}
.tz-big{border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
.tz-big .d{font-size:12px;opacity:.85}.tz-big .t{font-size:24px;font-weight:800;margin:4px 0}.tz-big .m{font-size:12px}
.tz-msg{width:100%;box-sizing:border-box;font-size:12px;padding:8px;border:1px solid #ccc;border-radius:8px;min-height:64px;font-family:inherit}
.tz-btns{display:flex;gap:6px;margin-top:6px}.tz-btns a,.tz-btns button{flex:1;text-align:center;padding:8px;border-radius:10px;border:none;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}
.tz-wa{background:#25D366;color:#fff}.tz-cp{background:#455A64;color:#fff}
.tz-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.tz-cal div{border-radius:6px;padding:5px 0;text-align:center;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent}
.tz-cal .h{font-size:10px;color:#888;font-weight:600;cursor:default;padding:0}.tz-cal .x{background:transparent;cursor:default}
.tz-cal .sel{border-color:#263238}
.tz-dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
</style>
<script>
const TZ_LL={0:['OK','verde'],1:['Vigilancia','amarillo'],2:['Alerta','naranja'],3:['Crítico','rojo'],null:['sin dato','gris']};
const TZ_SE={0:['OK','verde'],1:['Preparar','amarillo'],2:['Regar','naranja'],3:['Estrés','rojo'],null:['sin dato','gris']};
const TZ_DEC={0:['SÍ se fertiliza','verde','🟢'],1:['CON CUIDADO','naranja','🟠'],2:['NO se fertiliza','rojo','🔴'],null:['sin decisión','gris','⚪']};
const TZ_COL={verde:'#C6EFCE',amarillo:'#FFF59D',naranja:'#FFD180',rojo:'#FF8A80',gris:'#E0E0E0'};
let tzSel=null;
function tzN(x,n=0){return x==null?'—':Number(x).toLocaleString('es',{minimumFractionDigits:n,maximumFractionDigits:n})}
function tzB(m,k){const v=m[k]??m['null'];return `<span class="tz-b tz-${v[1]}">${v[0]}</span>`}
/* gráfico 14 días : 15 cm y 40 cm ; modo 'sat' (bandas saturado / húmedo) o 'riego' (umbrales de la textura) */
function tzChart(L,T,modo){
  const W=440,H=150,pl=28,pr=8,pt=6,pb=20;const S=L.series;if(!S.length)return '';
  const t0=Math.min(...S.map(s=>new Date(s.h0).getTime()));const t1=Math.max(...S.map(s=>new Date(s.h0).getTime()+(s.v.length-1)*3600000));
  const all=S.flatMap(s=>s.v.filter(v=>v!=null));const U=L.umb;
  let mx=modo==='riego'?Math.max(U.estres*1.15,...all):Math.max(15,Math.min(60,Math.max(...all,0)*1.1));
  const X=t=>pl+(t-t0)/(t1-t0||1)*(W-pl-pr),Y=v=>pt+(1-Math.min(v,mx)/mx)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  const bandas=modo==='riego'?[[0,U.bajo,'#C6EFCE'],[U.bajo,U.alto,'#FFF59D'],[U.alto,U.estres,'#FFD180'],[U.estres,mx,'#FF8A80']]
                             :[[0,T.sat,'#FF8A80'],[T.sat,T.hum,'#FFD180'],[T.hum,mx,'#C6EFCE']];
  for(const [a,b,c] of bandas){if(a>=mx)continue;s+=`<rect x="${pl}" y="${Y(Math.min(b,mx))}" width="${W-pl-pr}" height="${Y(a)-Y(Math.min(b,mx))}" fill="${c}" opacity=".45"/>`}
  const tk=modo==='riego'?[0,U.bajo,U.alto,U.estres]:[0,T.sat,T.hum,mx>30?30:null].filter(x=>x!=null);
  tk.forEach(v=>{if(v<=mx)s+=`<text x="${pl-3}" y="${Y(v)+3}" font-size="8" text-anchor="end" fill="#888">${v}</text>`});
  for(let t=Math.ceil(t0/86400000)*86400000-5*3600000;t<=t1;t+=86400000){if(t<t0)continue;const d=new Date(t);
    s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${pt}" y2="${H-pb}" stroke="#fff" stroke-width="1"/>`;
    if(d.getDate()%2===0)s+=`<text x="${X(t)}" y="${H-6}" font-size="8" text-anchor="middle" fill="#888">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</text>`}
  for(const se of S){const col=se.p===15?'#0B2E4F':'#1E88E5';const h0=new Date(se.h0).getTime();let d='',pen=false;
    se.v.forEach((v,i)=>{if(v==null){pen=false;return}const x=X(h0+i*3600000).toFixed(1),y=Y(v).toFixed(1);d+=(pen?'L':'M')+x+','+y;pen=true});
    s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${se.p===15?1.7:1.4}" ${se.p===40?'stroke-dasharray="4 2"':''}/>`}
  return s+'</svg>'}
function tzLeyendaChart(T,modo,U){return modo==='riego'
  ?`<div class="tz-leg"><span><i style="background:#0B2E4F"></i>15 cm</span><span><i style="background:#1E88E5"></i>40 cm (trazos)</span><span><i style="background:#C6EFCE"></i>&lt;${U.bajo}</span><span><i style="background:#FFF59D"></i>preparar ${U.bajo}–${U.alto}</span><span><i style="background:#FFD180"></i>regar ${U.alto}–${U.estres}</span><span><i style="background:#FF8A80"></i>estrés ≥${U.estres} kPa</span></div>`
  :`<div class="tz-leg"><span><i style="background:#0B2E4F"></i>15 cm</span><span><i style="background:#1E88E5"></i>40 cm (trazos)</span><span><i style="background:#FF8A80"></i>saturado &lt;${T.sat}</span><span><i style="background:#FFD180"></i>húmedo ${T.sat}–${T.hum}</span><span><i style="background:#C6EFCE"></i>oreado ≥${T.hum} kPa</span></div>`}
function tzVacio(T){return !T||!T.lotes||!T.lotes.length}
/* ── vista DRENAJE : asfixia por lote ── */
function tzDrenaje(T){
  if(tzVacio(T))return `<div class="tz-card">Sin datos de tensiómetros para esta finca.</div>`+tzVerif(T);
  let h=`<div class="tz-card"><div class="tz-ct">💧 Asfixia por lote<span>tensiómetros · ${T.ahora}</span></div>
  <div class="tz-sub">Horas seguidas de suelo saturado (&lt; ${T.sat} kPa) a 15 o 40 cm : 🟡 ≥ 24 h · 🟠 ≥ 48 h (o 15 y 40 cm ≥ 24 h) · 🔴 ≥ 72 h con pozo &lt; 0,80 m.</div>
  <table class="tz-tbl"><tr><th>Lote</th><th>Estado</th><th>Sat. 15 / 40 cm</th><th>Pozo</th></tr>`;
  for(const L of T.lotes){const d=L.dias[L.dias.length-1]||{};
    h+=`<tr onclick="document.getElementById('tz-l-${L.lote}').scrollIntoView({behavior:'smooth'})" style="cursor:pointer"><td><b>${L.lote}</b> <span style="color:#888;font-size:10px">${L.suelo}</span></td><td>${tzB(TZ_LL,L.ll)}</td>
      <td>${d.r15??'—'} h / ${d.r40??'—'} h</td><td>${L.pz==null?'—':tzN(L.pz,2)}</td></tr>`}
  h+=`</table></div>`;
  for(const L of T.lotes){
    h+=`<div class="tz-card" id="tz-l-${L.lote}"><div class="tz-ct">Lote ${L.lote} ${tzB(TZ_LL,L.ll)}<span>${L.suelo} · ${L.fam} · drenaje ${L.clase}<br>${L.est}${L.pozos.length?' · pozo #'+L.pozos.join(', #'):' · sin pozo'}</span></div>
    ${L.mll?`<div class="tz-sub">${L.mll}</div>`:''}${L.q.length?`<div class="tz-sub" style="color:#B71C1C">⚠ ${L.q.join(', ')} : sonda no válida hoy</div>`:''}
    ${tzChart(L,T,'sat')}${tzLeyendaChart(T,'sat')}
    <div class="tz-sub" style="margin-top:6px">Estado de los últimos 14 días</div><div class="tz-sq">${L.dias.map(d=>`<i title="${d.f}" style="background:${TZ_COL[TZ_LL[d.ll??'null'][1]]}"></i>`).join('')}</div>
    <div class="tz-sub">${L.series.map(s=>`${s.p} cm : ${tzN(s.u,1)} kPa (${s.ut})${s.run?' · saturada '+s.run+' h':''}`).join(' · ')}</div></div>`}
  if(T.jress.length){h+=`<div class="tz-card"><div class="tz-ct">⏱ Días de oreo tras lluvia ≥ 30 mm<span>15 cm vuelve a ≥ ${T.hum} kPa</span></div>
    <table class="tz-tbl"><tr><th>Lote</th><th>Lluvia</th><th>Días</th><th>Objetivo</th><th></th></tr>`;
    for(const j of T.jress)h+=`<tr><td><b>${j.lote}</b></td><td>${j.f} · ${j.mm} mm</td><td style="${j.lento?'color:#B71C1C;font-weight:700':''}">${j.e==='ok'?tzN(j.j,1):'≥ '+tzN(j.j,1)}</td><td>≤ ${j.obj}</td><td style="font-size:10px;color:#888">${j.e==='ok'?(j.lento?'lento':'✓'):j.e}</td></tr>`;
    h+=`</table><div class="tz-note">Más días que el objetivo = defecto de drenaje del lote (terciarios), no solo una lluvia grande.</div></div>`}
  return h+tzVerif(T)}
function tzVerif(T){if(!T||!T.verif||!T.verif.length)return '';
  return `<div class="tz-card"><div class="tz-ct">🔧 Sondas a verificar<span>no dan alertas</span></div>`+
   T.verif.map(v=>`<div class="tz-sub"><b>${v.s.replace(/^T-(Delia|Fiera)-+/,'')}</b> · ${v.c} — ${v.d}</div>`).join('')+
   `<div class="tz-note">E1 fuera de rango · E2 muda · E3 15 cm despegada · E4 plana · E5 cuarentena 72 h tras intervención (Bitácora).</div></div>`}
/* ── vista RIEGO : necesidad de riego por lote (15 cm) ── */
function tzRiego(T){
  if(tzVacio(T))return '<div class="tz-card">Sin datos de tensiómetros.</div>';
  let h=`<div class="tz-card"><div class="tz-ct">🌡 Tensiómetros — riego<span>${T.ahora}</span></div>
  <div class="tz-sub">Tensión máxima del día a 15 cm comparada con los umbrales de la textura del suelo ; 🔴 también si 40 cm &gt; 40 kPa 3 días seguidos (el riego no recarga el fondo).</div>
  <table class="tz-tbl"><tr><th>Lote</th><th>Estado</th><th>T15 máx</th><th>T40 media</th><th>Textura</th></tr>`;
  const Ls=[...T.lotes].sort((a,b)=>(b.se??-1)-(a.se??-1));
  for(const L of Ls)h+=`<tr><td><b>${L.lote}</b></td><td>${tzB(TZ_SE,L.se)}</td><td>${tzN(L.t15,1)}</td><td>${tzN(L.t40,1)}</td><td style="font-size:10px">${L.fam}</td></tr>`;
  h+=`</table><div class="tz-note">kPa. Umbrales 15 cm (preparar / regar / estrés) : arenoso 15/20/35 · limoso 20/30/45 · arcilloso 25/35/50 (hoja Umbrales de Tensiometros_Parametros).</div></div>`;
  for(const L of Ls){h+=`<div class="tz-card"><div class="tz-ct">Lote ${L.lote} ${tzB(TZ_SE,L.se)}<span>${L.suelo} · ${L.fam}${L.g!=null?' · gradiente 40−15 : '+tzN(L.g,1)+' kPa':''}</span></div>
    ${tzChart(L,T,'riego')}${tzLeyendaChart(T,'riego',L.umb)}
    <div class="tz-sq" style="margin-top:6px">${L.dias.map(d=>`<i title="${d.f}" style="background:${TZ_COL[TZ_SE[d.se??'null'][1]]}"></i>`).join('')}</div></div>`}
  return h+tzVerif(T)}
/* ── vista CALENDARIO de fertilización ── */
function tzCalendario(T){
  if(!T||!T.cal||!T.cal.length)return '<div class="tz-card">Sin datos para el calendario.</div>';
  const hoy=T.cal[T.cal.length-1];if(!tzSel)tzSel=hoy.f;const D=T.cal.find(x=>x.f===tzSel)||hoy;const dec=TZ_DEC[hoy.c??'null'];

function bombeoView(){
  let h=`<div class="card" style="font-size:11px;color:#555;line-height:1.5"><b>Qué muestra esta pestaña</b> : lo que el bombero anotó en la <b>Hoja del día</b> (papel), un renglón por día de hoja (de 7 h a 7 h). Los días <b>sin Hoja</b> guardada aparecen en gris.<br>
  <b>Bombeado</b> = horas de cada bomba × caudal de su régimen (hoja Parámetros), en mm sobre la superficie drenada y en m³.<br>
  <b>Arranques</b> = veces que se prendió una bomba (muchos arranques = efecto « yoyo »). <b>⚠</b> = líneas fuera de consigna, <b>‼</b> = alerta.<br>

    const w=L.filter(x=>x.n7),wh=w.filter(x=>!x.sin),sum=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0),fal=w.length-wh.length;
    h+=`<div class="card"><div class="ct">${e}<span>últimos 7 días : <b style="color:${fal?'#C00000':'#2E7D32'}">${wh.length} Hoja${wh.length>1?'s':''} de 7</b></span></div>
    <div class="kpis" style="border:none;margin:0;padding:4px 0"><div class="k"><div class="kl">Lluvia 7 d</div><div class="kv">${Math.round(sum(w,'ll'))}<span style="font-size:10px"> mm</span></div></div>
    <div class="k"><div class="kl">Bombeado</div><div class="kv" style="color:#0277BD">${Math.round(sum(wh,'mm'))}<span style="font-size:10px"> mm</span></div><div style="font-size:9px;color:#999">${Math.round(sum(wh,'m3')).toLocaleString('es')} m³${fal?' · '+wh.length+' Hojas':''}</div></div>
    <div class="k"><div class="kl">Arranques</div><div class="kv">${sum(wh,'arr')}</div></div>
    <div class="k"><div class="kl">Fuera consigna</div><div class="kv ${sum(wh,'fuera')?'up':''}">${sum(wh,'fuera')}</div></div></div>
    ${(E.av||[]).length?`<div style="background:#FDECEA;color:#7B1E1E;border-radius:8px;padding:6px 8px;font-size:11px;font-weight:600;margin:4px 0 8px;line-height:1.5">${E.av.join('<br>')}<br><span style="font-weight:400;color:#888">Anotado en Observación · las líneas siguen controladas con la consigna normal.</span></div>`:''}
    <table class="tbl" style="font-size:11.5px"><tr><th>Día de hoja</th><th>Lluvia<br>mm</th><th>Bombeado<br>mm</th><th>Horas<br>peq. / gr.</th><th>Arran-<br>ques</th><th>Nivel máx<br>Hoja</th><th>Nivel máx<br>sensor</th><th></th></tr>`;
    for(const x of L){
      if(x.sin){h+=`<tr class="sin"><td>${x.dow} ${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td class="lab" colspan="4">sin Hoja</td><td class="${zc(x.ns,z)}">${x.ns??'—'}</td><td></td></tr>`;continue}
      h+=`<tr><td>${x.dow} ${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td><b>${x.mm}</b></td><td style="white-space:nowrap">${x.hp}/${x.hg}</td>
      <td class="${x.arr>=5?'warn':''}">${x.arr}</td><td class="${zc(x.nmax,z)}">${x.nmax??'—'}</td><td class="${zc(x.ns,z)}">${x.ns??'—'}</td><td>${x.al?`<span class="al">${x.al}‼</span> `:''}${x.fuera?`<span class="warn">${x.fuera}⚠</span>`:''}</td></tr>`;
      if(x.inc||x.horo)h+=`<tr class="nota"><td colspan="8">${x.inc?'⚠ '+x.inc:''}${x.inc&&x.horo?'<br>':''}${x.horo?'⏱ '+x.horo:''}</td></tr>`}
    h+='</table></div>'}
  return h;}
function zc(n,z){if(n==null||!z)return '';const pp=z.Peq_parada_cm,pa=z.Peq_arranque_seco_cm,al=z.Alerta_lluvia_cm;return (n<pp||n>=al)?'zr':(n>pa?'zo':'zv')}
function canalWin(c){const HW=c.hw||48,fin=c.fin??(c.pts.length?c.pts[c.pts.length-1][0]:HW);
  let w0=cw===null?fin-HW:cw;return Math.max(0,Math.min(w0,fin-HW));}
function canalPts(c,w0,HW){const r=[];let prevP=null;for(const p of c.pts){if(p[0]<w0){prevP=p;continue}if(p[0]>w0+HW)break;r.push(p)}
  if(prevP&&r.length&&r[0][0]-prevP[0]<=7)r.unshift(prevP);return r;}
function canalChart(c){
  const HW=c.hw||48,W=440,H=230,pl=34,pr=16,pt=8,pb=30,w0=canalWin(c),X0=w0,X1=w0+HW,R=c.rep,P=canalPts(c,w0,HW);
  const mx=Math.max(R.Alerta_lluvia_cm*1.12,...P.map(p=>p[1]))*1.02;
  const X=h=>pl+(h-X0)/(X1-X0)*(W-pl-pr),Y=v=>pt+(1-v/mx)*(H-pt-pb);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  // zonas : rojo bajo la parada, verde hasta el arranque sin lluvia, naranja hasta la alerta con lluvia, rojo encima
  for(const [a,b,col,op] of [[0,R.Peq_parada_cm,'#FF0000',.16],[R.Peq_parada_cm,R.Peq_arranque_seco_cm,'#4CAF50',.18],
      [R.Peq_arranque_seco_cm,R.Alerta_lluvia_cm,'#FFC000',.22],[R.Alerta_lluvia_cm,mx,'#FF0000',.16]])
    s+=`<rect x="${pl}" y="${Y(Math.min(b,mx))}" width="${W-pl-pr}" height="${Math.max(0,Y(a)-Y(Math.min(b,mx)))}" fill="${col}" opacity="${op}"/>`;
  const tk=mx<250?[0,50,100,150,200]:[0,100,200,300,400,500];
  tk.filter(v=>v<mx).forEach(v=>{s+=`<text x="${pl-4}" y="${Y(v)+3}" font-size="9" text-anchor="end" fill="#999">${v}</text>`});
  // ejes de tiempo : cada 6 h, fecha a medianoche
  const t0=new Date(new Date(c.ini).getTime()+w0*3600000),hh0=t0.getHours()+t0.getMinutes()/60;
  for(let h=w0+(6-hh0%6)%6;h<=X1+0.01;h+=6){const dd=new Date(new Date(c.ini).getTime()+h*3600000),hr=dd.getHours(),noche=hr===0;
    s+=`<line x1="${X(h)}" x2="${X(h)}" y1="${pt}" y2="${H-pb}" stroke="${noche?'#90A4AE':'#ffffff'}" stroke-opacity="${noche?.7:.8}"/>`;
    s+=`<text x="${X(h)}" y="${H-pb+11}" font-size="9" text-anchor="middle" fill="#888">${String(hr).padStart(2,'0')}h</text>`;
    if(noche)s+=`<text x="${X(h)}" y="${H-pb+23}" font-size="9" font-weight="600" text-anchor="middle" fill="#555">${['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'][dd.getDay()]} ${String(dd.getDate()).padStart(2,'0')}/${String(dd.getMonth()+1).padStart(2,'0')}</text>`}
  const LL=c.ll.filter(p=>p[0]>=X0&&p[0]<X1),llmax=Math.max(10,...LL.map(p=>p[1])),bw=(W-pl-pr)/HW;
  LL.forEach(p=>{const h=p[1]/llmax*(H-pt-pb)*0.35;
    s+=`<rect x="${X(p[0])+0.5}" y="${pt}" width="${Math.max(1.5,bw-1)}" height="${h}" fill="#1E88E5" opacity=".75"><title>${p[1]} mm</title></rect>`;
    if(bw>6&&p[1]>=5)s+=`<text x="${X(p[0])+bw/2}" y="${pt+h+9}" font-size="8" text-anchor="middle" fill="#0D47A1">${Math.round(p[1])}</text>`});
  // cotas : alerta sin lluvia (trazo) y bordes de las zonas
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${Y(R.Alerta_seco_cm)}" y2="${Y(R.Alerta_seco_cm)}" stroke="#C62828" stroke-dasharray="5 3" stroke-width="1.2"/>`;
  s+=`<text x="${W-pr-2}" y="${Y(R.Alerta_seco_cm)-3}" font-size="8.5" text-anchor="end" fill="#C62828">alerta sin lluvia ${R.Alerta_seco_cm}</text>`;
  for(const [v,col] of [[R.Alerta_lluvia_cm,'#B71C1C'],[R.Peq_arranque_seco_cm,'#8D6E00'],[R.Peq_parada_cm,'#1E5631']])
    if(v<mx)s+=`<text x="${pl+3}" y="${Y(v)-3}" font-size="8.5" fill="${col}">${v}</text>`;
  // nivel : cada medida del sensor (sin promedio) ; hueco > 7 h = sensor mudo
  let d='',prev=null;P.forEach(p=>{const x=Math.max(X(p[0]),pl);d+=(prev===null||p[0]-prev>7?'M':'L')+x.toFixed(1)+','+Y(p[1]).toFixed(1);prev=p[0]});
  s+=`<path d="${d}" fill="none" stroke="#0B2E4F" stroke-width="1.6" stroke-linejoin="round"/>`;
  const u=P[P.length-1];if(u&&cw===null)s+=`<circle cx="${X(u[0])}" cy="${Y(u[1])}" r="3.5" fill="#0B2E4F"/>`;
  return s+'</svg>';}
function cwVer(hh){cw=Math.round(hh);render();const e=document.getElementById('cchart');if(e)e.scrollIntoView({behavior:'smooth',block:'start'});}
function cwMove(dh){const c=(D.canal||{})[ce];cw=canalWin(c)+dh;if(cw>=c.fin-(c.hw||48))cw=null;render();}
function cwDia(v){const c=(D.canal||{})[ce];if(!v)return;const t=new Date(v+'T07:00'),hh=(t-new Date(c.ini))/3600000;cwVer(hh-6);}

  const C=D.canal||{},ks=Object.keys(C);

  const w=c.dias,R=c.rep,sum=k=>w.reduce((a,x)=>a+(x[k]||0),0),rg=w.length?Math.round(w.reduce((a,x)=>a+x.rg,0)/w.length):null;
  h+=`<div class="kpis"><div class="k"><div class="kl">Nivel ahora</div><div class="kv ${zc(c.ultimo.n,R)}" style="border-radius:6px">${c.ultimo.n}</div><div style="font-size:9px;color:#999">${c.ultimo.t}</div></div>
  <div class="k"><div class="kl">% zona verde 7d</div><div class="kv ${rg!==null&&rg<50?'up':''}">${rg??'—'}%</div></div>

        wll=c.ll.filter(p=>p[0]>=w0&&p[0]<w0+HW).reduce((a,p)=>a+p[1],0),fd=hh=>{const d=new Date(new Date(c.ini).getTime()+hh*3600000);

  h+=`<div class="card" id="cchart"><div class="ct">${ce} — ${cw===null?'últimas '+HW+' h':fd(w0)+' → '+fd(w0+HW)}<span>nivel cm · lluvia mm/h</span></div>
  <div class="cnav"><button onclick="cwMove(-12)" ${w0<=0?'disabled':''}>‹ 12 h</button>
  <input type="date" value="${iso(w0+6)}" min="${iso(0)}" max="${iso(c.fin)}" onchange="cwDia(this.value)">
  <button onclick="cwMove(12)" ${cw===null?'disabled':''}>12 h ›</button><button class="${cw===null?'on':''}" onclick="cw=null;render()">Ahora</button></div>
  <div style="font-size:11px;color:#555;margin:2px 0 4px">en esta ventana : máx <b>${wmax??'—'}</b> cm · lluvia <b>${Math.round(wll)}</b> mm${cw===null?'':' · <span style="color:#888">tocar un día o un episodio abajo para verlo</span>'}</div>${canalChart(c)}
  <div class="legc"><span><i style="background:#0B2E4F"></i>nivel (cada medida)</span><span><i style="background:#1E88E5;height:6px"></i>lluvia</span>
  <span><i style="background:#4CAF50;height:7px;opacity:.5"></i>verde ${R.Peq_parada_cm}–${R.Peq_arranque_seco_cm}</span><span><i style="background:#FFC000;height:7px;opacity:.6"></i>naranja ${R.Peq_arranque_seco_cm}–${R.Alerta_lluvia_cm}</span>
  <span><i style="background:#FF0000;height:7px;opacity:.4"></i>rojo &lt;${R.Peq_parada_cm} y ≥${R.Alerta_lluvia_cm}</span><span><i style="background:#C62828"></i>alerta sin lluvia ${R.Alerta_seco_cm}</span></div></div>`;
  h+=`<div class="card"><div class="ct">Por día<span>7 h → 7 h</span></div><table class="tbl"><tr><th>Día ▸</th><th>Lluvia</th><th>Máx</th><th>h > ${R.Peq_arranque_seco_cm}</th><th>% verde</th><th>Vac.</th><th>Parada</th></tr>`;
  for(const x of w)h+=`<tr class="clk" onclick="cwVer(${x.h}-6)"><td>${x.f}</td><td>${x.ll==null?'—':Math.round(x.ll)}</td><td class="${zc(x.max,R)}">${x.max}</td><td class="${x.ha?'warn':''}">${x.ha}</td><td>${x.rg}%</td><td>${x.vid}</td><td class="${x.pb?'warn':''}">${x.par??'—'}${x.pb?' ⚠':''}</td></tr>`;

function motoresView(){const M=D.mot;if(!M)return '<div class="card empty">Sin datos de motores</div>';

     (M.al.length?M.al.map(a=>`<div class="malert z-${a.nivel}">${a.txt}</div>`).join(''):'<div style="color:#2E7D32;font-weight:600">✓ Ninguna alerta</div>')+'</div>';

    h+='</div>'}
