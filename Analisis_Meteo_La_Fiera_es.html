<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meteo La Fiera</title>
<style>
:root{ --finca: #2B8A3E; --accent: #E65100; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
  background:#f5f7f5; color:#1a1a1a; min-height:100vh; }
#wrap{ max-width:520px; margin:0 auto; padding:14px 12px 40px; }

#header{ text-align:center; padding:6px 0 10px; }
#header h1{ font-size:19px; font-weight:800; margin:0 0 2px; color:var(--accent); letter-spacing:.3px; }
#header .finca{ font-size:15px; font-weight:700; margin:0; color:var(--finca); }
#header .updated{ font-size:11px; color:#999; margin-top:5px; }
#header .updated strong{ color:var(--accent); font-weight:600; }

/* Tarjeta de gráficos en la portada (directo) */
.gcard{ background:#fff; border-radius:14px; box-shadow:0 2px 10px rgba(0,0,0,.07);
  padding:8px 8px 10px; margin-bottom:10px; }
.gbar{ display:flex; align-items:center; gap:8px; padding:2px 4px 6px; }
.gtitle{ flex:1; font-size:13px; font-weight:800; color:var(--finca); line-height:1.15; }
.gicons{ display:flex; gap:6px; flex:none; }
.gic{ display:flex; align-items:center; gap:4px; border:0; background:var(--finca); color:#fff;
  border-radius:9px; padding:6px 9px; font-size:12px; font-weight:800; cursor:pointer; }
.gic span{ font-size:14px; line-height:1; }
.gic.ghost{ background:#f0f2f0; color:#555; padding:6px 8px; }
.gic:active{ opacity:.85; }
.gsvg{ width:100%; height:240px; cursor:pointer; }
.gsvg svg{ width:100%; height:100%; }
.gstep{ display:flex; align-items:center; justify-content:center; gap:12px; margin:6px 0 2px; }
.ihint{ text-align:center; font-size:10.5px; color:#aaa; margin:4px 0 0; line-height:1.5; }

/* ===== Carrusel pantalla completa (horizontal) ===== */
#carousel{ display:none; position:fixed; inset:0; background:#fff; z-index:60; }
#carousel.open{ display:block; }
.land{ position:absolute; top:50%; left:50%; width:100vh; height:100vw;
  transform:translate(-50%,-50%) rotate(90deg); transform-origin:center center;
  display:flex; flex-direction:column; background:#fff; }
@media(orientation:landscape){ .land{ width:100vw; height:100vh; transform:translate(-50%,-50%) rotate(0deg); } }
.ctop{ display:flex; align-items:center; gap:8px; padding:7px 12px 5px; flex:none; }
.ctop .cw{ font-size:14px; font-weight:800; color:#333; flex:1; text-align:center; }
.cright{ display:flex; gap:6px; }
.cnav{ border:0; background:#f0f2f0; border-radius:8px; width:32px; height:32px; font-size:20px;
  line-height:1; color:#555; cursor:pointer; }
.cclose{ border:0; background:#f0f2f0; border-radius:50%; width:32px; height:32px; font-size:15px; color:#555; cursor:pointer; }
/* controles de tablas dentro de ctop */
.tctrl{ display:none; align-items:center; gap:5px; flex-wrap:wrap; }
.tctrl.show{ display:flex; }
.tseg{ display:flex; background:#f0f2f0; border-radius:8px; overflow:hidden; }
.tseg button{ border:0; background:transparent; padding:6px 10px; font-size:12px; font-weight:700; color:#666; cursor:pointer; }
.tseg button.on{ background:var(--finca); color:#fff; }
.ychip{ border:1px solid #dcdee2; background:#f0f2f0; color:#666; border-radius:14px;
  padding:4px 9px; font-size:11px; font-weight:700; cursor:pointer; }
.ychip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.wlab{ font-size:13px; font-weight:800; color:#333; min-width:72px; text-align:center; }

.vp{ flex:1; min-height:0; overflow:hidden; }
#track{ display:flex; height:100%; will-change:transform; }
.slide{ min-width:100%; height:100%; display:flex; flex-direction:column; padding:0 10px 4px; overflow:hidden; }
.slide .stl{ font-size:13px; font-weight:800; color:var(--finca); text-align:center; margin:1px 0 3px; flex:none; }
.scont{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; }
.scont svg{ width:100%; height:100%; }
.dots{ display:flex; justify-content:center; gap:7px; padding:5px 0 7px; flex-wrap:wrap; flex:none; }
.dot{ width:8px; height:8px; border-radius:50%; background:#d0d4d0; transition:.2s; }
.dot.on{ background:var(--finca); width:20px; border-radius:4px; }
.nodata{ padding:40px; text-align:center; color:#999; }

/* tablas */
.ptw{ flex:1; min-height:0; overflow:auto; -webkit-overflow-scrolling:touch; }
.pt{ border-collapse:separate; border-spacing:0; width:100%; font-size:12px; table-layout:fixed; }
.pt th,.pt td{ padding:5px 3px; text-align:center; border-bottom:1px solid #eee;
  font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pt thead th{ position:sticky; top:0; background:#f4f6f4; font-weight:700; color:#555; z-index:3;
  box-shadow:0 1px 0 #e2e6e2; line-height:1.12; font-size:11px; }
.pt td.idc,.pt th.idc{ position:sticky; left:0; z-index:2; background:#fff; font-weight:800; width:62px;
  border-right:2px solid #eee; }
.pt thead th.idc{ z-index:4; background:#f4f6f4; }
.pt td.idc{ border-left:5px solid var(--rc,#e0e0e0); }
.pt tbody tr:nth-child(even) td{ background:#fbfcfb; }
.pt tbody tr:nth-child(even) td.idc{ background:#fbfcfb; }
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <h1>🌦️ Meteo</h1>
    <p class="finca">La Fiera</p>
  </div>

  <div class="gcard">
    <div class="gbar">
      <span class="gtitle" id="gtitle">—</span>
      <div class="gicons">
        <button class="gic" onclick="openCar('t')"><span>📊</span>Datos</button>
        <button class="gic ghost" onclick="openGraphsAt()" title="Pantalla completa"><span>⛶</span></button>
      </div>
    </div>
    <div class="gsvg" id="gsvg"></div>
    <div class="gstep">
      <button class="cnav" onclick="stepW(-1)">‹</button>
      <span class="wlab" id="wlabInline">Sem. —</span>
      <button class="cnav" onclick="stepW(1)">›</button>
    </div>
    <div class="dots" id="idots"></div>
    <p class="ihint">Desliza para cambiar de gráfico · toca ⛶ o gira el teléfono para verlo en grande</p>
  </div>
</div>

<!-- Carrusel pantalla completa -->
<div id="carousel">
  <div class="land">
    <div class="ctop">
      <div class="tctrl" id="gctrl">
        <div class="tseg">
          <button onclick="stepW(-1)">‹</button>
          <button onclick="stepW(1)">›</button>
        </div>
        <span class="wlab" id="wlab">Sem. —</span>
      </div>
      <div class="tctrl" id="tctrl">
        <div class="tseg">
          <button id="segSem" onclick="setPeriod('weekly')">📈 Sem</button>
          <button id="segDia" onclick="setPeriod('daily')">📅 Día</button>
        </div>
        <span id="ychips"></span>
      </div>
      <div class="cw" id="cw">—</div>
      <div class="cright">
        <button class="cnav" onclick="prevS()">‹</button>
        <button class="cnav" onclick="nextS()">›</button>
        <button class="cclose" onclick="closeC()">✕</button>
      </div>
    </div>
    <div class="vp" id="vp"><div id="track"></div></div>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
"use strict";
const YEAR_COLORS = {"2026": "#E53935", "2025": "#1E88E5", "2024": "#2E7D32", "2023": "#9E9E9E"};
const FINCA = getComputedStyle(document.documentElement).getPropertyValue('--finca').trim();
function yc(y){ return YEAR_COLORS[y] || FINCA; }
const charts = BUNDLE.charts;

/* ---------- número bonito para el eje ---------- */
function nf(v){
  const a=Math.abs(v);
  if(a>=1000) return Math.round(v).toString();
  if(a>=100)  return Math.round(v).toString();
  if(a>=10)   return (Math.round(v*10)/10).toString().replace('.',',');
  return (Math.round(v*100)/100).toString().replace('.',',');
}

/* ---------- gráfico SVG con eje recalibrado ---------- */
function chart(c){
  const W=900,H=440,pl=54,pr=16,pt=30,pb=42,pw=W-pl-pr,ph=H-pt-pb;
  const years=c.series.map(s=>s.year);
  const latest=Math.max.apply(null,years);
  let vals=[];
  c.series.forEach(s=>s.data.forEach(v=>{ if(v!=null) vals.push(v); }));
  if(!vals.length) return '<div class="nodata">Sin datos</div>';
  let lo=Math.min.apply(null,vals), hi=Math.max.apply(null,vals), sp=hi-lo;
  if(c.type==='bar'){                       // barras desde 0, máx. real
    lo=0; hi = hi<=0 ? 1 : hi*1.08;
  }else{                                     // líneas: recuadre al rango real
    if(sp<=0){ const pad=(Math.abs(hi)||1)*0.05+0.5; lo-=pad; hi+=pad; }
    else{ lo-=sp*0.08; hi+=sp*0.08; }
  }
  const X=w=>pl+(w-1)/52*pw, Y=v=>pt+(1-(v-lo)/(hi-lo))*ph;
  let g='';
  const NY=5;
  for(let i=0;i<=NY;i++){ const gv=lo+(hi-lo)*i/NY, gy=Y(gv);
    g+='<line x1="'+pl+'" y1="'+gy.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+gy.toFixed(1)+'" stroke="'+(i===0?'#cfd4cf':'#eef1ee')+'"/>';
    g+='<text x="'+(pl-6)+'" y="'+(gy+4).toFixed(1)+'" text-anchor="end" font-size="12" fill="#8a8a8a">'+nf(gv)+'</text>'; }
  for(let w=1;w<=52;w+=4){ const xx=X(w);
    g+='<line x1="'+xx.toFixed(1)+'" y1="'+pt+'" x2="'+xx.toFixed(1)+'" y2="'+(H-pb)+'" stroke="#f0f3f0"/>';
    g+='<text x="'+xx.toFixed(1)+'" y="'+(H-pb+17)+'" text-anchor="middle" font-size="11" fill="#8a8a8a">'+w+'</text>'; }
  g+='<text x="'+(pl+pw/2).toFixed(0)+'" y="'+(H-5)+'" text-anchor="middle" font-size="11" fill="#aaa">Semana · '+c.unit+'</text>';
  g+='<line x1="'+pl+'" y1="'+pt+'" x2="'+pl+'" y2="'+(H-pb)+'" stroke="#cfd4cf"/>';

  let body='';
  if(c.type==='bar'){
    const nS=c.series.length, slot=pw/53, bw=Math.max(1.3,(slot*0.82)/nS);
    c.series.forEach((s,si)=>{ const col=yc(s.year);
      s.data.forEach((v,wi)=>{ if(v==null||v<=0) return;
        const base=X(wi+1)-slot*0.41, x=base+si*bw, y=Y(v), h=(H-pb)-y; if(h<=0) return;
        body+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+col+'" opacity="0.85"/>'; }); });
  }else{
    c.series.forEach(s=>{ const col=yc(s.year), thick=(s.year===latest);
      let pts=[]; s.data.forEach((v,wi)=>{ if(v!=null) pts.push(X(wi+1).toFixed(1)+','+Y(v).toFixed(1)); });
      if(pts.length>1) body+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="'+col+'" stroke-width="'+(thick?3.2:2)+'" stroke-linejoin="round" stroke-linecap="round"/>';
      if(thick) s.data.forEach((v,wi)=>{ if(v!=null) body+='<circle cx="'+X(wi+1).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.6" fill="'+col+'"/>'; });
    });
  }
  let lg='',lx=pl+2; c.series.forEach(s=>{
    lg+='<line x1="'+lx+'" y1="15" x2="'+(lx+18)+'" y2="15" stroke="'+yc(s.year)+'" stroke-width="'+(c.type==='bar'?7:3.2)+'"/>'
      +'<text x="'+(lx+23)+'" y="19" font-size="13" fill="#555">'+s.year+'</text>'; lx+=74; });
  // ---- marcador de semana + valor (solo año en curso) ----
  let mk='';
  const mw=selW, mx=X(mw);
  mk+='<line x1="'+mx.toFixed(1)+'" y1="'+pt+'" x2="'+mx.toFixed(1)+'" y2="'+(H-pb)+'" stroke="#E65100" stroke-width="1.6" stroke-dasharray="5 3"/>';
  mk+='<text x="'+mx.toFixed(1)+'" y="'+(pt-3)+'" text-anchor="middle" font-size="13" fill="#E65100" font-weight="800">S'+mw+'</text>';
  const latestY=Math.max.apply(null,c.series.map(s=>s.year));
  const sL=c.series.find(s=>s.year===latestY);
  if(sL){ const v=sL.data[mw-1];
    if(v!=null){ const col=yc(latestY), yy=Y(v), leftSide=mw>40;
      const exact=v.toFixed(c.dec==null?1:c.dec).replace('.',',');
      mk+='<circle cx="'+mx.toFixed(1)+'" cy="'+yy.toFixed(1)+'" r="4.6" fill="'+col+'" stroke="#fff" stroke-width="1.6"/>';
      const tx=leftSide?mx-9:mx+9, anc=leftSide?'end':'start';
      mk+='<text x="'+tx.toFixed(1)+'" y="'+(yy-7).toFixed(1)+'" text-anchor="'+anc+'" font-size="15" font-weight="800" fill="'+col+'" stroke="#fff" stroke-width="3.4" style="paint-order:stroke">'+exact+'</text>'; } }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">'+g+body+mk+lg+'</svg>';
}

/* ---------- tabla de un grupo ---------- */
function tableHTML(period, year, gi){
  const t = period==='weekly'?BUNDLE.weekly:BUNDLE.daily;
  const g = t.groups[gi];
  const rows = (t.rowsByYear[String(year)])||[];
  if(!rows.length) return '<div class="nodata">Sin datos para '+year+'</div>';
  let h='<div class="ptw"><table class="pt"><thead><tr><th class="idc">'+t.id_label+'</th>';
  g.cols.forEach(c=>{ h+='<th>'+c.replace(' ','<br>')+'</th>'; });
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{ h+='<tr><td class="idc" style="--rc:'+r.color+'" title="'+r.colorName+'">'+r.id+'</td>';
    g.cols.forEach(c=>{ h+='<td>'+(r.vals[c]!=null?r.vals[c]:'—')+'</td>'; }); h+='</tr>'; });
  h+='</tbody></table></div>';
  return h;
}

/* ---------- carrusel ---------- */
let mode='g', carIdx=0, carItems=[];
let period='weekly', curYear=null;
let selW=1, maxW=52;

/* semana marcada por defecto = última con datos del año más reciente */
(function initSel(){
  let mx=1;
  charts.forEach(c=>{ if(!c.series.length) return;
    const ly=Math.max.apply(null,c.series.map(s=>s.year));
    const s=c.series.find(x=>x.year===ly);
    if(s) s.data.forEach((v,i)=>{ if(v!=null && i+1>mx) mx=i+1; }); });
  maxW=Math.max(mx,1); selW=maxW;
})();
function setWlab(){ const el=document.getElementById('wlab'); if(el) el.textContent='Sem. '+selW; }
function buildGraphItems(){ carItems = charts.map(c=>({ t:c.title, html:'<div class="scont">'+chart(c)+'</div>' })); }

/* ---- gráfico en línea (portada) ---- */
let gIdx=0;
function renderInline(){
  const c=charts[gIdx];
  document.getElementById('gtitle').textContent=c.title;
  document.getElementById('gsvg').innerHTML=chart(c);
  document.getElementById('wlabInline').textContent='Sem. '+selW;
  document.getElementById('idots').innerHTML=charts.map((_,i)=>'<span class="dot'+(i===gIdx?' on':'')+'"></span>').join('');
}
function inlineNext(){ gIdx=(gIdx+1)%charts.length; renderInline(); }
function inlinePrev(){ gIdx=(gIdx-1+charts.length)%charts.length; renderInline(); }
function openGraphsAt(){ openCar('g'); }

function stepW(d){
  let n=selW+d; if(n<1)n=52; if(n>52)n=1;   // en bucle
  selW=n; setWlab(); renderInline();
  if(document.getElementById('carousel').classList.contains('open') && mode==='g'){
    buildGraphItems(); renderTrack(); goTo(carIdx,false);
  }
}

function tbl(){ return period==='weekly'?BUNDLE.weekly:BUNDLE.daily; }
function ensureYear(){ const t=tbl(); if(curYear===null||t.years.indexOf(curYear)<0) curYear=t.years[0]; }

function buildYearChips(){
  const t=tbl(); ensureYear();
  document.getElementById('ychips').innerHTML = t.years.map(y=>
    '<button class="ychip'+(y===curYear?' on':'')+'" onclick="setYear('+y+')">'+y+'</button>').join('');
  document.getElementById('segSem').classList.toggle('on', period==='weekly');
  document.getElementById('segDia').classList.toggle('on', period==='daily');
}

function buildTableItems(){
  const t=tbl(); ensureYear();
  carItems = t.groups.map((g,i)=>({ t:g.name, html: tableHTML(period, curYear, i) }));
}

function openCar(kind){
  mode=kind;
  const tctrl=document.getElementById('tctrl'), gctrl=document.getElementById('gctrl');
  if(kind==='g'){
    tctrl.classList.remove('show'); gctrl.classList.add('show'); setWlab();
    buildGraphItems();
  }else{
    gctrl.classList.remove('show'); tctrl.classList.add('show');
    buildYearChips(); buildTableItems();
  }
  renderTrack();
  let start = (kind==='g') ? gIdx : 0;
  carIdx=start; goTo(start,false);
  document.getElementById('carousel').classList.add('open');
  document.body.style.overflow='hidden';
}

function renderTrack(){
  const tr=document.getElementById('track'); tr.innerHTML='';
  carItems.forEach(it=>{ const d=document.createElement('div'); d.className='slide';
    d.innerHTML='<div class="stl">'+it.t+'</div>'+it.html; tr.appendChild(d); });
  document.getElementById('dots').innerHTML=carItems.map(()=>'<span class="dot"></span>').join('');
}

function setPeriod(p){ period=p; buildYearChips(); buildTableItems(); renderTrack(); goTo(Math.min(carIdx,carItems.length-1),false); }
function setYear(y){ curYear=y; buildYearChips(); buildTableItems(); renderTrack(); goTo(carIdx,false); }

function goTo(i,anim){
  const n=carItems.length; carIdx=((i%n)+n)%n;
  const tr=document.getElementById('track');
  tr.style.transition=anim?'transform .28s ease':'none';
  tr.style.transform='translateX('+(-carIdx*100)+'%)';
  document.querySelectorAll('#dots .dot').forEach((d,j)=>d.classList.toggle('on',j===carIdx));
  document.getElementById('cw').textContent=carItems[carIdx].t;
}
function nextS(){ goTo(carIdx+1,true); }
function prevS(){ goTo(carIdx-1,true); }
function closeC(){ document.getElementById('carousel').classList.remove('open'); document.body.style.overflow=''; }

/* swipe en el visor */
(function(){ const vp=document.getElementById('vp'); let x0=0,y0=0,on=false;
  vp.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; on=true; },{passive:true});
  vp.addEventListener('touchend',e=>{ if(!on)return; on=false;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ dx<0?nextS():prevS(); } },{passive:true});
})();
window.addEventListener('keydown',e=>{
  if(!document.getElementById('carousel').classList.contains('open')) return;
  if(e.key==='ArrowRight') nextS(); else if(e.key==='ArrowLeft') prevS(); else if(e.key==='Escape') closeC();
});

/* gestos en la tarjeta de portada: tap = pantalla completa, swipe = cambiar gráfico */
(function(){ const gs=document.getElementById('gsvg'); let x0=0,y0=0,on=false;
  gs.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; on=true; },{passive:true});
  gs.addEventListener('touchend',e=>{ if(!on)return; on=false;
    const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>40 && Math.abs(dx)>Math.abs(dy)){ dx<0?inlineNext():inlinePrev(); }
    else if(Math.abs(dx)<12 && Math.abs(dy)<12){ openCar('g'); } },{passive:true});
})();

/* inicializa la portada con el primer gráfico */
renderInline();
</script>
</body>
</html>
