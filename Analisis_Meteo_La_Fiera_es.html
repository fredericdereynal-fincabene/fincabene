<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Meteo La Fiera</title>
<style>
:root{
  --finca: #2B8A3E;
  --accent: #E65100;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; background:#f4f5f7; color:#1a1a1a;
  font-family:-apple-system,Segoe UI,Roboto,sans-serif; }
body{ padding:0 0 30px; }

header{ background:var(--finca); color:#fff; padding:12px 16px 10px;
  position:sticky; top:0; z-index:50; box-shadow:0 2px 8px rgba(0,0,0,.15); }
header h1{ margin:0; font-size:18px; font-weight:800; letter-spacing:.3px; }
header .sub{ font-size:11px; opacity:.9; margin-top:2px; }

.card{ background:#fff; margin:12px 10px; border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08); overflow:hidden; }
.card-head{ display:flex; align-items:center; justify-content:space-between;
  padding:10px 14px; border-bottom:1px solid #eee; }
.card-head .t{ font-size:13px; font-weight:800; text-transform:uppercase;
  letter-spacing:.6px; color:var(--finca); }
.card-head .hint{ font-size:10px; color:#999; }

/* --- navegación swipe (flechas + puntos) --- */
.nav{ display:flex; align-items:center; justify-content:space-between;
  padding:8px 12px; gap:10px; }
.nav .arrow{ background:#f0f1f3; border:1px solid #dcdee2; color:var(--finca);
  width:38px; height:38px; border-radius:9px; font-size:20px; font-weight:bold;
  cursor:pointer; flex:0 0 auto; }
.nav .arrow:active{ background:#e4e6ea; }
.nav .title{ flex:1; text-align:center; font-size:14px; font-weight:700; }
.dots{ display:flex; justify-content:center; gap:6px; padding:2px 0 10px; }
.dot{ width:8px; height:8px; border-radius:50%; background:#d3d6da; cursor:pointer;
  transition:background .2s,transform .2s; }
.dot.on{ background:var(--finca); transform:scale(1.25); }

/* --- gráficos --- */
#chartStage{ position:relative; touch-action:pan-y; user-select:none; }
#chartSvgWrap{ padding:4px 6px 2px; }
svg{ display:block; width:100%; height:auto; }
.legend{ display:flex; justify-content:center; flex-wrap:wrap; gap:12px;
  padding:2px 10px 12px; }
.legend .li{ display:flex; align-items:center; gap:6px; font-size:12px;
  cursor:pointer; user-select:none; }
.legend .li.off{ opacity:.35; }
.legend .sw{ width:16px; height:4px; border-radius:2px; }
.legend .sw.bar{ height:12px; width:12px; border-radius:2px; }

/* --- tablas --- */
.tabs{ display:flex; gap:8px; padding:10px 12px 4px; }
.tab{ flex:1; text-align:center; padding:8px 0; border-radius:9px;
  font-size:13px; font-weight:700; background:#f0f1f3; color:#555;
  border:1px solid #dcdee2; cursor:pointer; }
.tab.on{ background:var(--finca); color:#fff; border-color:var(--finca); }
.yearbar{ display:flex; gap:6px; padding:4px 12px 8px; flex-wrap:wrap; }
.ychip{ padding:5px 12px; border-radius:16px; font-size:12px; font-weight:700;
  background:#f0f1f3; color:#666; border:1px solid #dcdee2; cursor:pointer; }
.ychip.on{ background:var(--accent); color:#fff; border-color:var(--accent); }

#tableStage{ touch-action:pan-y; user-select:none; }
.tablewrap{ overflow:auto; -webkit-overflow-scrolling:touch;
  max-height:60vh; border-top:1px solid #eee; }
table{ border-collapse:collapse; width:100%; table-layout:fixed; font-size:11px; }
th,td{ padding:5px 4px; text-align:center; border-bottom:1px solid #eee;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
thead th{ position:sticky; top:0; background:#fafbfc; z-index:3;
  font-size:10px; color:#555; font-weight:700; }
th.idcol, td.idcol{ position:sticky; left:0; z-index:2; background:#fff;
  font-weight:800; border-right:2px solid #eee; width:64px; }
thead th.idcol{ z-index:4; background:#fafbfc; }
td.idcol{ border-left:5px solid var(--rowcol,#e0e0e0); }
tbody tr:nth-child(even) td{ background:#fbfbfc; }
tbody tr:nth-child(even) td.idcol{ background:#fbfbfc; }
.emptytab{ padding:26px 16px; text-align:center; color:#999; font-size:13px; }

footer{ text-align:center; font-size:10px; color:#aaa; margin-top:16px; }
@media (min-width:820px){
  .card{ max-width:780px; margin-left:auto; margin-right:auto; }
}
</style>
</head>

<script>
"use strict";
const YEAR_COLORS = {"2024": "#FFB300", "2025": "#8E24AA", "2026": "#2B8A3E"};
const FINCA_COLOR = getComputedStyle(document.documentElement).getPropertyValue('--finca').trim();
function yearColor(y){ return YEAR_COLORS[y] || FINCA_COLOR; }

/* ==================================================================
   GRÁFICOS (SVG vanilla)
   ================================================================== */
let chIdx = 0;
const hiddenYears = {};                 // {year:true} series ocultas
const charts = BUNDLE.charts;

function niceMax(v){
  if(v<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  const step = n<=1?1:n<=2?2:n<=5?5:10;
  return step*p;
}
function niceMin(v){
  if(v>=0) return 0;
  return -niceMax(-v);
}

function drawChart(){
  const c = charts[chIdx];
  document.getElementById('chTitle').textContent = c.title;

  // dominio de valores (sólo años visibles)
  let vmax=-Infinity, vmin=Infinity, hasData=false;
  c.series.forEach(s=>{
    if(hiddenYears[s.year]) return;
    s.data.forEach(v=>{ if(v!=null){ hasData=true; if(v>vmax)vmax=v; if(v<vmin)vmin=v; } });
  });
  const wrap = document.getElementById('chartSvgWrap');
  if(!hasData){ wrap.innerHTML='<div class="emptytab">Sin datos para mostrar</div>'; buildLegend(); return; }

  const W=700, H=340, mL=44, mR=12, mT=12, mB=34;
  const plotW=W-mL-mR, plotH=H-mT-mB;
  let ymax=niceMax(vmax), ymin=(vmin<0?niceMin(vmin):0);
  if(ymax===ymin) ymax=ymin+1;
  const weeks=53;
  const xFor = w => mL + (plotW*(w-1)/(weeks-1));
  const yFor = v => mT + plotH*(1-(v-ymin)/(ymax-ymin));

  let svg=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img">`;
  // rejilla horizontal + etiquetas Y
  const nY=5;
  for(let i=0;i<=nY;i++){
    const val=ymin+(ymax-ymin)*i/nY, y=yFor(val);
    svg+=`<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W-mR}" y2="${y.toFixed(1)}" stroke="#eee" stroke-width="1"/>`;
    svg+=`<text x="${mL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#999">${(+val.toFixed(val<10?1:0))}</text>`;
  }
  // etiquetas X (semanas cada 4)
  for(let w=1; w<=52; w+=4){
    const x=xFor(w);
    svg+=`<text x="${x.toFixed(1)}" y="${H-mB+16}" text-anchor="middle" font-size="9" fill="#aaa">S${w}</text>`;
  }
  svg+=`<line x1="${mL}" y1="${mT}" x2="${mL}" y2="${H-mB}" stroke="#ccc"/>`;
  svg+=`<line x1="${mL}" y1="${(H-mB).toFixed(1)}" x2="${W-mR}" y2="${(H-mB).toFixed(1)}" stroke="#ccc"/>`;

  const visible = c.series.filter(s=>!hiddenYears[s.year]);
  if(c.type==='bar'){
    const nS=visible.length||1;
    const slot=plotW/weeks, bw=Math.max(1.4,(slot*0.8)/nS);
    visible.forEach((s,si)=>{
      const col=yearColor(s.year);
      s.data.forEach((v,wi)=>{
        if(v==null) return;
        const w=wi+1, base=xFor(w)-slot*0.4;
        const x=base+si*bw, y=yFor(v), h=(H-mB)-y;
        if(h<=0) return;
        svg+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${col}" opacity="0.85"/>`;
      });
    });
  } else {
    visible.forEach(s=>{
      const col=yearColor(s.year);
      const latest = s.year===Math.max(...c.series.map(x=>x.year));
      const sw = latest?3:1.8;
      let d="", pen=false;
      s.data.forEach((v,wi)=>{
        if(v==null){ pen=false; return; }
        const x=xFor(wi+1), y=yFor(v);
        d+= (pen?`L`:`M`)+x.toFixed(1)+" "+y.toFixed(1)+" ";
        pen=true;
      });
      svg+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round" stroke-linecap="round"/>`;
      // puntos del año más reciente
      if(latest){
        s.data.forEach((v,wi)=>{ if(v==null)return;
          svg+=`<circle cx="${xFor(wi+1).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="2.4" fill="${col}"/>`; });
      }
    });
  }
  svg+=`</svg>`;
  wrap.innerHTML=svg;
  buildLegend();
  drawDots('chDots', charts.length, chIdx, i=>{ chIdx=i; drawChart(); });
}

function buildLegend(){
  const c=charts[chIdx];
  const el=document.getElementById('chLegend');
  el.innerHTML='';
  c.series.forEach(s=>{
    const li=document.createElement('div');
    li.className='li'+(hiddenYears[s.year]?' off':'');
    const swCls = c.type==='bar' ? 'sw bar' : 'sw';
    li.innerHTML=`<span class="${swCls}" style="background:${yearColor(s.year)}"></span>${s.year}`;
    li.onclick=()=>{ hiddenYears[s.year]=!hiddenYears[s.year]; drawChart(); };
    el.appendChild(li);
  });
}

/* ==================================================================
   TABLAS
   ================================================================== */
let period='weekly';   // weekly | daily
let grpIdx=0;
let curYear=null;

function tbl(){ return period==='weekly'?BUNDLE.weekly:BUNDLE.daily; }

function initYear(){
  const t=tbl();
  if(curYear===null || t.years.indexOf(curYear)<0){
    curYear = t.years.length? t.years[0] : null;
  }
}

function buildYearBar(){
  const t=tbl();
  const bar=document.getElementById('yearBar');
  bar.innerHTML='';
  t.years.forEach(y=>{
    const chip=document.createElement('div');
    chip.className='ychip'+(y===curYear?' on':'');
    chip.textContent=y;
    chip.onclick=()=>{ curYear=y; drawTable(); };
    bar.appendChild(chip);
  });
}

function drawTable(){
  const t=tbl();
  initYear();
  buildYearBar();
  const groups=t.groups;
  if(grpIdx>=groups.length) grpIdx=0;
  const g=groups[grpIdx];
  document.getElementById('tbTitle').textContent=g.name;

  const rows = (curYear!=null && t.rowsByYear[String(curYear)]) ? t.rowsByYear[String(curYear)] : [];
  const wrap=document.getElementById('tableWrap');
  if(!rows.length){ wrap.innerHTML='<div class="emptytab">Sin datos para este año</div>';
    drawDots('tbDots', groups.length, grpIdx, i=>{grpIdx=i;drawTable();}); return; }

  let html='<table><thead><tr>';
  html+=`<th class="idcol">${t.id_label}</th>`;
  g.cols.forEach(c=>{ html+=`<th>${c.replace(' ','<br>')}</th>`; });
  html+='</tr></thead><tbody>';
  rows.forEach(r=>{
    html+='<tr>';
    html+=`<td class="idcol" style="--rowcol:${r.color}" title="${r.colorName}">${r.id}</td>`;
    g.cols.forEach(c=>{ html+=`<td>${(r.vals[c]!=null?r.vals[c]:'—')}</td>`; });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
  drawDots('tbDots', groups.length, grpIdx, i=>{grpIdx=i;drawTable();});
}

function setPeriod(p){
  period=p;
  document.getElementById('tabSem').classList.toggle('on', p==='weekly');
  document.getElementById('tabDia').classList.toggle('on', p==='daily');
  grpIdx=0; curYear=null;
  drawTable();
}

/* ==================================================================
   PUNTOS (dots) reutilizable
   ================================================================== */
function drawDots(elId, n, active, onPick){
  const el=document.getElementById(elId);
  el.innerHTML='';
  for(let i=0;i<n;i++){
    const d=document.createElement('div');
    d.className='dot'+(i===active?' on':'');
    d.onclick=()=>onPick(i);
    el.appendChild(d);
  }
}

/* ==================================================================
   SWIPE (en bucle) — genérico
   ================================================================== */
function attachSwipe(el, onLeft, onRight){
  let x0=null,y0=null,active=false;
  el.addEventListener('touchstart',e=>{
    if(e.touches.length!==1) return;
    x0=e.touches[0].clientX; y0=e.touches[0].clientY; active=true;
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!active||x0===null) return; active=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)>45 && Math.abs(dx)>Math.abs(dy)*1.4){
      if(dx<0) onLeft(); else onRight();
    }
    x0=y0=null;
  },{passive:true});
  // ratón (escritorio)
  let mx=null;
  el.addEventListener('mousedown',e=>{ mx=e.clientX; });
  el.addEventListener('mouseup',e=>{
    if(mx===null) return; const dx=e.clientX-mx; mx=null;
    if(Math.abs(dx)>60){ if(dx<0) onLeft(); else onRight(); }
  });
}

function chNext(){ chIdx=(chIdx+1)%charts.length; drawChart(); }
function chPrev(){ chIdx=(chIdx-1+charts.length)%charts.length; drawChart(); }
function tbNext(){ const n=tbl().groups.length; grpIdx=(grpIdx+1)%n; drawTable(); }
function tbPrev(){ const n=tbl().groups.length; grpIdx=(grpIdx-1+n)%n; drawTable(); }

/* ==================================================================
   INIT
   ================================================================== */
document.getElementById('chNext').onclick=chNext;
document.getElementById('chPrev').onclick=chPrev;
document.getElementById('tbNext').onclick=tbNext;
document.getElementById('tbPrev').onclick=tbPrev;
document.getElementById('tabSem').onclick=()=>setPeriod('weekly');
document.getElementById('tabDia').onclick=()=>setPeriod('daily');

attachSwipe(document.getElementById('chartStage'), chNext, chPrev);
attachSwipe(document.getElementById('tableStage'), tbNext, tbPrev);

window.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){ chNext(); }
  else if(e.key==='ArrowLeft'){ chPrev(); }
});

drawChart();
drawTable();
</script>
</body>
</html>
